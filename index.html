<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Angry Birds · Classic Web</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79cdf5;touch-action:none;font-family:Arial,system-ui,sans-serif;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}.pill{padding:9px 14px;border-radius:18px;background:#273c48b8;color:white;font-weight:900;border:2px solid #ffffff44;box-shadow:0 5px 16px #23404b33}.btn{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:4;border:0;border-radius:16px;padding:11px 16px;background:#fff;color:#34444a;font-weight:900;box-shadow:0 5px 0 #87939a;}.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);z-index:3;background:#263d49c9;color:#fff;padding:9px 14px;border-radius:15px;font-size:13px;font-weight:800;transition:.2s}.hide{opacity:0;pointer-events:none}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#12384a66}.card{width:min(90vw,410px);text-align:center;padding:26px;border-radius:30px;background:linear-gradient(#fff,#f5f8f7);box-shadow:0 24px 70px #234a5b55}.card h1{margin:6px 0;font-size:30px}.card p{color:#60727a;line-height:1.6}.start{border:0;border-radius:17px;padding:14px 30px;background:linear-gradient(#f85b4c,#d9362e);color:#fff;font-weight:900;font-size:17px;box-shadow:0 6px 0 #a92824}.hideModal{display:none}.stars{font-size:25px;color:#f2bd2e}
</style></head>
<body><canvas id="game"></canvas><div class="hud"><div class="pill">🐦 小鸟挑战</div><div class="pill">⭐ <span id="score">0</span>　🏆 <span id="best">0</span></div></div><div id="hint" class="hint">拖住小鸟向后拉，松手发射</div><button id="reset" class="btn">↻ 重来</button><div id="modal" class="modal"><div class="card"><div class="stars">★★★</div><h1 id="mt">愤怒的小鸟</h1><p id="md">经典弹弓玩法：拉开弹弓，控制角度和力度，摧毁建筑并击败小猪。</p><button id="start" class="start">开始游戏</button></div></div>
<script>
const C=document.querySelector('#game'),g=C.getContext('2d');let W,H,D=1,ground,bird,drag=false,started=false,score=0,best=+localStorage.birdBest||0,blocks=[],pigs=[],bits=[],shake=0,last=0,done=false;const $=id=>document.getElementById(id),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;g.setTransform(D,0,0,D,0,0);ground=H*.79;reset(false)}addEventListener('resize',resize);
function A(){return{x:Math.max(110,W*.14),y:ground-92}}
function reset(hide=true){let a=A(),bx=Math.max(W*.58,500);score=0;done=false;$('score').textContent=0;bird={x:a.x,y:a.y,r:27,vx:0,vy:0,launched:false,alive:true};blocks=[
{x:bx,y:ground-100,w:32,h:100,hp:2,k:'wood'},{x:bx+112,y:ground-100,w:32,h:100,hp:2,k:'wood'},
{x:bx+18,y:ground-198,w:126,h:28,hp:2,k:'wood'},{x:bx+158,y:ground-175,w:32,h:75,hp:3,k:'stone'},
{x:bx+220,y:ground-100,w:32,h:100,hp:2,k:'wood'},{x:bx+135,y:ground-270,w:120,h:28,hp:3,k:'glass'}];pigs=[{x:bx+74,y:ground-132,r:26,alive:true},{x:bx+194,y:ground-302,r:24,alive:true}];bits=[];shake=0;if(hide)$('modal').classList.add('hideModal');draw()}
function world(){g.clearRect(0,0,W,H);let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#63c4f3');sky.addColorStop(.62,'#bcecff');sky.addColorStop(.8,'#d9f4ff');sky.addColorStop(.801,'#76c35c');sky.addColorStop(1,'#459c3b');g.fillStyle=sky;g.fillRect(0,0,W,H);
cloud(110,100,1);cloud(W*.48,155,.75);cloud(W*.82,85,.9);g.fillStyle='#65b95a';g.beginPath();g.moveTo(0,ground+5);for(let x=0;x<W;x+=70)g.quadraticCurveTo(x+35,ground-38-(x%160)*.08,x+70,ground+5);g.lineTo(W,H);g.lineTo(0,H);g.fill();g.fillStyle='#3e9137';g.fillRect(0,ground,W,H-ground);g.fillStyle='#2e7d31';for(let x=8;x<W;x+=37){g.fillRect(x,ground+5,2,16);g.fillRect(x+8,ground+11,1,10)}}
function cloud(x,y,s){g.save();g.globalAlpha=.42;g.fillStyle='#fff';g.beginPath();g.arc(x,y,25*s,0,7);g.arc(x+29*s,y-10*s,32*s,0,7);g.arc(x+65*s,y,22*s,0,7);g.fill();g.restore()}
function sling(){let a=A();g.save();g.lineCap='round';g.strokeStyle='#59351f';g.lineWidth=15;g.beginPath();g.moveTo(a.x-17,ground+3);g.lineTo(a.x-7,ground-58);g.moveTo(a.x+19,ground+3);g.lineTo(a.x+9,ground-58);g.stroke();g.strokeStyle='#9b6032';g.lineWidth=9;g.stroke();g.strokeStyle='#41271c';g.lineWidth=4;g.beginPath();g.moveTo(a.x-7,ground-58);g.lineTo(drag?bird.x:a.x,drag?bird.y:a.y);g.moveTo(a.x+9,ground-58);g.lineTo(drag?bird.x:a.x,drag?bird.y:a.y);g.stroke();g.restore()}
function birdDraw(){let b=bird;g.save();g.translate(b.x,b.y);g.rotate(b.launched?Math.atan2(b.vy,b.vx)*.07:0);g.shadowColor='#532b24aa';g.shadowBlur=9;g.shadowOffsetY=6;let r=g.createRadialGradient(-10,-13,2,6,6,42);r.addColorStop(0,'#ff765f');r.addColorStop(.55,'#e94337');r.addColorStop(1,'#b92528');g.fillStyle=r;g.beginPath();g.arc(0,0,b.r,0,7);g.fill();g.shadowBlur=0;
// belly
g.fillStyle='#f5dcc4';g.beginPath();g.ellipse(4,11,16,12,0,0,7);g.fill();
// tail feathers
g.fillStyle='#d32e2f';g.beginPath();g.moveTo(-23,8);g.lineTo(-39,-2);g.lineTo(-29,14);g.lineTo(-40,24);g.lineTo(-20,20);g.fill();
// angry brows
g.strokeStyle='#272220';g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(-18,-18);g.lineTo(-1,-24);g.moveTo(4,-24);g.lineTo(21,-18);g.stroke();
// eyes
g.fillStyle='#fff';g.beginPath();g.ellipse(-9,-6,9,11,0,0,7);g.ellipse(9,-6,9,11,0,0,7);g.fill();g.fillStyle='#171515';g.beginPath();g.arc(-6,-5,3.5,0,7);g.arc(10,-5,3.5,0,7);g.fill();
// beak
g.fillStyle='#f4a51d';g.strokeStyle='#874712';g.lineWidth=2;g.beginPath();g.moveTo(5,1);g.lineTo(31,7);g.lineTo(6,14);g.closePath();g.fill();g.stroke();g.restore()}
function pigDraw(p){if(!p.alive)return;g.save();g.translate(p.x,p.y);g.shadowColor='#32602b55';g.shadowBlur=8;g.shadowOffsetY=5;let q=g.createRadialGradient(-8,-9,2,5,5,35);q.addColorStop(0,'#a5e76e');q.addColorStop(.6,'#65c84e');q.addColorStop(1,'#3e9b38');g.fillStyle=q;g.beginPath();g.arc(0,0,p.r,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#82d65b';g.beginPath();g.ellipse(0,10,13,9,0,0,7);g.fill();g.fillStyle='#224023';g.beginPath();g.arc(-8,-7,3,0,7);g.arc(8,-7,3,0,7);g.fill();g.strokeStyle='#34552d';g.lineWidth=2;g.beginPath();g.moveTo(-7,10);g.quadraticCurveTo(0,14,7,10);g.stroke();g.strokeStyle='#79a956';g.lineWidth=3;g.beginPath();g.moveTo(-12,-21);g.lineTo(-6,-15);g.moveTo(12,-21);g.lineTo(6,-15);g.stroke();g.restore()}
function blockDraw(b){g.save();let r=6;g.beginPath();g.roundRect(b.x,b.y,b.w,b.h,r);let grad=g.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);if(b.k==='wood'){grad.addColorStop(0,'#e1a05c');grad.addColorStop(.5,'#bd7437');grad.addColorStop(1,'#8f512b')}else if(b.k==='stone'){grad.addColorStop(0,'#c7c8c2');grad.addColorStop(1,'#777b79')}else{grad.addColorStop(0,'#eafcffaa');grad.addColorStop(.5,'#8ee8f0aa');grad.addColorStop(1,'#55c8d0aa')}g.fillStyle=grad;g.fill();g.strokeStyle=b.k==='wood'?'#67371f':b.k==='stone'?'#535a59':'#3299a4';g.lineWidth=3;g.stroke();if(b.k==='wood'){g.strokeStyle='#7d4928aa';g.lineWidth=2;for(let y=b.y+9;y<b.y+b.h;y+=12){g.beginPath();g.moveTo(b.x+5,y);g.quadraticCurveTo(b.x+b.w/2,y-4,b.x+b.w-5,y+2);g.stroke()}}else if(b.k==='glass'){g.strokeStyle='#fff8';g.lineWidth=3;g.beginPath();g.moveTo(b.x+8,b.y+b.h-5);g.lineTo(b.x+b.w-7,b.y+5);g.stroke()}g.restore()}
function particles(x,y,color){for(let i=0;i<18;i++)bits.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,s:2+Math.random()*5,l:1,c:color})}
function scoreSet(n){score+=n;$('score').textContent=score;if(score>best){best=score;localStorage.birdBest=best;$('best').textContent=best}}
function collide(){for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];if(b.hp>0&&bird.x+bird.r>b.x&&bird.x-bird.r<b.x+b.w&&bird.y+bird.r>b.y&&bird.y-bird.r<b.y+b.h){b.hp--;scoreSet(50);particles(bird.x,bird.y,b.k==='glass'?'#bdf8ff':'#d18a47');shake=5;if(b.hp<=0){scoreSet(50);blocks.splice(i,1)}break}}for(let p of pigs)if(p.alive&&Math.hypot(bird.x-p.x,bird.y-p.y)<bird.r+p.r){p.alive=false;scoreSet(500);particles(p.x,p.y,'#7bdd55');shake=10}}
function physics(dt){if(!bird.launched)return;bird.vy+=720*dt;bird.x+=bird.vx*dt;bird.y+=bird.vy*dt;bird.vx*=.998;collide();if(bird.y+bird.r>ground){bird.y=ground-bird.r;bird.vy*=-.38;bird.vx*=.62;if(Math.abs(bird.vy)<45&&Math.abs(bird.vx)<45)bird.alive=false}if(bird.x>W+100||bird.y>H+100)bird.alive=false;if(!bird.alive&&!done){done=true;setTimeout(()=>{if(pigs.every(p=>!p.alive)){showEnd('通关！','小猪全部解决。得分：'+score)}},300)}}
function trajectory(){if(!drag)return;let a=A(),dx=bird.x-a.x,dy=bird.y-a.y,vx=-dx*6.2,vy=-dy*6.2,px=bird.x,py=bird.y;g.fillStyle='#fff';for(let i=0;i<18;i++){px+=vx*.075;py+=vy*.075;vy+=.8;g.globalAlpha=.72-i*.035;g.beginPath();g.arc(px,py,3,0,7);g.fill()}g.globalAlpha=1}
function draw(){g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);world();sling();trajectory();blocks.forEach(blockDraw);pigs.forEach(pigDraw);if(bird.alive)birdDraw();bits.forEach(p=>{g.globalAlpha=p.l;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s,0,7);g.fill()});g.restore()}
function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;if(started){physics(dt);bits.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l-=.035});bits=bits.filter(p=>p.l>0);shake*=.9;draw()}requestAnimationFrame(loop)}
function point(e){let r=C.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
C.addEventListener('pointerdown',e=>{if(!started||bird.launched||!bird.alive)return;let p=point(e);if(Math.hypot(p.x-bird.x,p.y-bird.y)<60){drag=true;C.setPointerCapture(e.pointerId)}});
C.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e),a=A();bird.x=cl(p.x,a.x-100,a.x+75);bird.y=cl(p.y,a.y-105,a.y+105)});
C.addEventListener('pointerup',e=>{if(!drag)return;drag=false;let a=A(),dx=bird.x-a.x,dy=bird.y-a.y;bird.x=a.x;bird.y=a.y;bird.vx=-dx*6.2;bird.vy=-dy*6.2;bird.launched=true;$('hint').classList.add('hide')});
function showEnd(t,d){$('mt').textContent=t;$('md').textContent=d;$('start').textContent='再来一局';$('modal').classList.remove('hideModal')}
$('start').onclick=()=>{started=true;$('modal').classList.add('hideModal');$('hint').classList.remove('hide');$('start').textContent='开始游戏';reset(false)};$('reset').onclick=()=>{started=true;reset(true)};$('best').textContent=best;resize();requestAnimationFrame(loop);
</script></body></html>
