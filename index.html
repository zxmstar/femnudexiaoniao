<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>愤怒的小鸟 · 弹射挑战</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bd5ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;background:linear-gradient(#78cef7 0%,#b9ebff 62%,#8fd36b 62%,#68b84e 100%)}#hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;color:#fff;text-shadow:0 2px 4px #17435b;font-weight:800}.pill{background:#173b4dcc;border:2px solid #ffffff55;border-radius:18px;padding:8px 13px;backdrop-filter:blur(8px);font-size:14px}.title{font-size:17px}.actions{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:8px}.btn{border:0;border-radius:16px;background:#fff;color:#173b4d;font-weight:800;padding:11px 14px;box-shadow:0 5px 15px #17435b44}.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);background:#173b4dcc;color:#fff;padding:8px 14px;border-radius:14px;font-size:13px;pointer-events:none;transition:.3s}.hidden{opacity:0}.modal{position:fixed;inset:0;background:#102d3d88;display:grid;place-items:center}.card{width:min(88vw,390px);padding:25px;border-radius:28px;background:#fff;color:#183b4c;text-align:center;box-shadow:0 20px 60px #173b4d55}.card h1{margin:0 0 8px;font-size:28px}.card p{color:#527080;line-height:1.6}.start{border:0;background:#ef473f;color:#fff;font-size:17px;font-weight:900;padding:13px 28px;border-radius:17px;box-shadow:0 7px 0 #b82c29}.stars{font-size:30px;letter-spacing:5px}.hide{display:none}
</style></head>
<body><canvas id="game"></canvas><div id="hud"><div class="pill title">🐦 弹射挑战</div><div class="pill">⭐ <span id="score">0</span>　🏆 <span id="best">0</span></div></div><div id="hint" class="hint">拖动小鸟瞄准，松手发射</div><div class="actions"><button class="btn" id="reset">↻ 重来</button></div><div id="modal" class="modal"><div class="card"><div class="stars">★★★</div><h1>愤怒的小鸟</h1><p>手机横竖屏都能玩。按住小鸟向后拖，利用弹弓发射，撞碎建筑并击败目标。</p><button class="start" id="start">开始游戏</button></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr,scale,ground,score=0,best=+localStorage.birdBest||0,started=false,drag=false,bird,blocks=[],pigs=[],particles=[],shake=0,last=0,aim=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);ground=H*.78;scale=Math.min(W/900,H/620);reset()}addEventListener('resize',resize);
function reset(){score=0;document.getElementById('score').textContent=0;bird={x:125,y:ground-85,r:25,vx:0,vy:0,launched:false,alive:true};blocks=[{x:590,y:ground-90,w:28,h:90,hp:2},{x:690,y:ground-90,w:28,h:90,hp:2},{x:640,y:ground-185,w:140,h:25,hp:2},{x:745,y:ground-165,w:28,h:75,hp:2},{x:800,y:ground-90,w:28,h:90,hp:2},{x:745,y:ground-250,w:140,h:25,hp:3}];pigs=[{x:645,y:ground-120,r:25,alive:true},{x:745,y:ground-280,r:24,alive:true}];particles=[];shake=0;draw()}
function draw(){x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawWorld();drawTrajectory();blocks.forEach(drawBlock);pigs.forEach(drawPig);if(bird.alive)drawBird(bird.x,bird.y,bird.r);particles.forEach(p=>{x.globalAlpha=p.life;x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill()});x.restore()}
function drawWorld(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#76cdf4');g.addColorStop(.68,'#c5f1ff');g.addColorStop(.681,'#8dd46d');g.addColorStop(1,'#55ad43');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fff8';for(let i=0;i<6;i++){let cx=(i*190+70)%W; x.beginPath();x.arc(cx,100+i%2*65,26,0,7);x.arc(cx+27,106+i%2*65,20,0,7);x.arc(cx-25,108+i%2*65,18,0,7);x.fill()}x.fillStyle='#4a9d3b';x.fillRect(0,ground,W,H-ground);for(let i=0;i<W;i+=35){x.fillStyle=i%70?'#5cad45':'#67b94d';x.fillRect(i,ground+5,2,18)}}
function drawBird(px,py,r){x.save();x.translate(px,py);x.rotate(Math.atan2(bird.vy,bird.vx)*.08);x.fillStyle='#e83932';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.fillStyle='#f6d7ae';x.beginPath();x.ellipse(3,10,15,11,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(8,-6,8,0,7);x.arc(-8,-6,8,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(10,-5,3,0,7);x.arc(-6,-5,3,0,7);x.fill();x.fillStyle='#222';x.fillRect(-18,-23,18,7);x.fillRect(2,-23,18,7);x.fillStyle='#f6a51c';x.beginPath();x.moveTo(7,1);x.lineTo(30,7);x.lineTo(7,13);x.fill();x.fillStyle='#f0c4a1';x.beginPath();x.arc(-13,13,6,0,7);x.fill();x.restore()}
function drawBlock(b){x.fillStyle='#9b642f';x.fillRect(b.x,b.y,b.w,b.h);x.strokeStyle='#5c351b';x.lineWidth=3;x.strokeRect(b.x,b.y,b.w,b.h);x.strokeStyle='#c78948';x.lineWidth=2;x.beginPath();x.moveTo(b.x+5,b.y+8);x.lineTo(b.x+b.w-5,b.y+b.h-8);x.moveTo(b.x+b.w-5,b.y+8);x.lineTo(b.x+5,b.y+b.h-8);x.stroke()}
function drawPig(p){if(!p.alive)return;x.fillStyle='#65c84c';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.fillStyle='#b4e895';x.beginPath();x.arc(p.x,p.y+8,11,0,7);x.fill();x.fillStyle='#173';x.beginPath();x.arc(p.x-9,p.y-7,3,0,7);x.arc(p.x+9,p.y-7,3,0,7);x.fill();x.strokeStyle='#173';x.lineWidth=2;x.beginPath();x.arc(p.x,p.y+9,6,0,3.2);x.stroke()}
function drawTrajectory(){if(!drag||bird.launched)return;let dx=bird.x-125,dy=bird.y-(ground-85);let vx=-dx*.11,vy=-dy*.11,px=bird.x,py=bird.y;aim=[];for(let i=0;i<22;i++){px+=vx*1.7;py+=vy*1.7;vy+=.38;if(py>ground)break;aim.push([px,py])}x.fillStyle='#fff';aim.forEach((q,i)=>{if(i%2===0){x.globalAlpha=.7-i*.025;x.beginPath();x.arc(q[0],q[1],3,0,7);x.fill()}});x.globalAlpha=1}
function boom(px,py,color='#ffd34d'){for(let i=0;i<18;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,s:Math.random()*5+2,life:1,color})}
function hitTest(){for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];if(b.hp>0&&bird.x+bird.r>b.x&&bird.x-bird.r<b.x+b.w&&bird.y+bird.r>b.y&&bird.y-bird.r<b.y+b.h){b.hp--;score+=50;boom(bird.x,bird.y,'#d89048');if(b.hp<=0){score+=50;blocks.splice(i,1)}shake=5;break}}for(const p of pigs){if(p.alive&&Math.hypot(bird.x-p.x,bird.y-p.y)<bird.r+p.r){p.alive=false;score+=500;boom(p.x,p.y,'#78db52');shake=9}}document.getElementById('score').textContent=score;if(score>best){best=score;localStorage.birdBest=best;document.getElementById('best').textContent=best}}
function physics(dt){if(!bird.launched)return;bird.vy+=700*dt;bird.x+=bird.vx*dt;bird.y+=bird.vy*dt;bird.vx*=.999;if(bird.y+bird.r>ground){bird.y=ground-bird.r;bird.vy*=-.42;bird.vx*=.62;if(Math.abs(bird.vy)<55&&Math.abs(bird.vx)<55)bird.alive=false}hitTest();if(bird.x>W+80||bird.y>H+100)bird.alive=false;if(!bird.alive&&pigs.every(p=>!p.alive)){setTimeout(()=>{document.getElementById('modal').classList.remove('hide');document.querySelector('.card h1').textContent='通关！';document.querySelector('.card p').textContent='目标全部击败。得分：'+score+'，继续挑战更高分。';},350)}}
function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;if(started){physics(dt);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life-=.025});particles=particles.filter(p=>p.life>0);shake*=.9;draw()}requestAnimationFrame(loop)}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX??e.touches[0].clientX)-r.left,y:(e.clientY??e.touches[0].clientY)-r.top}}
c.addEventListener('pointerdown',e=>{if(!started||bird.launched||!bird.alive)return;let p=pos(e);if(Math.hypot(p.x-bird.x,p.y-bird.y)<55){drag=true;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(!drag)return;let p=pos(e),dx=Math.max(-100,Math.min(80,p.x-125)),dy=Math.max(-100,Math.min(100,p.y-(ground-85)));bird.x=125+dx;bird.y=ground-85+dy});c.addEventListener('pointerup',e=>{if(!drag)return;drag=false;let dx=bird.x-125,dy=bird.y-(ground-85);bird.x=125;bird.y=ground-85;bird.vx=-dx*6.4;bird.vy=-dy*6.4;bird.launched=true;document.getElementById('hint').classList.add('hidden')});
document.getElementById('start').onclick=()=>{started=true;document.getElementById('modal').classList.add('hide');document.getElementById('hint').classList.remove('hidden');reset()};document.getElementById('reset').onclick=()=>{document.getElementById('modal').classList.add('hide');started=true;reset()};document.getElementById('best').textContent=best;resize();requestAnimationFrame(loop);
</script></body></html>
