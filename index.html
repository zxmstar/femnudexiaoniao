<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>怒鸟弹弓·经典关卡</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#74cbed;touch-action:none;user-select:none}#app{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}canvas{display:block;touch-action:none}.tip{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 12px;border:2px solid #633d25;border-radius:14px;background:#fff7dfdd;color:#4b321f;font:bold 13px Arial;z-index:3;pointer-events:none}@media(orientation:landscape){.tip{display:none}}</style></head><body><div id="app"><canvas id="c"></canvas></div><div class="tip">建议横屏玩｜按住红鸟向左下拖，松手发射</div><script>
const c=document.getElementById('c'),x=c.getContext('2d');const W=1366,H=768;let S=1,OX=0,OY=0,dpr=1;let bird,pigs=[],parts=[],blocks=[],score=0,shots=3,drag=false,state='ready',last=0,shake=0;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function fit(){dpr=Math.min(devicePixelRatio||1,2);let vw=innerWidth,vh=innerHeight;S=Math.min(vw/W,vh/H);OX=(vw-W*S)/2;OY=(vh-H*S)/2;c.width=vw*dpr;c.height=vh*dpr;x.setTransform(dpr,0,0,dpr,0,0);reset()}function reset(){score=0;shots=3;state='ready';parts=[];blocks=[];pigs=[];bird={x:208,y:566,r:39,vx:0,vy:0,live:true,launched:false};level();draw()}
function level(){
 // classic-style compact fortress
 B(875,606,34,126,'wood');B(1060,606,34,126,'wood');B(910,548,150,30,'wood');B(914,470,30,100,'stone');B(1018,470,30,100,'stone');B(900,420,160,28,'glass');
 B(1140,606,30,126,'wood');B(1280,606,30,126,'wood');B(1155,548,155,30,'wood');B(1165,472,28,105,'stone');B(1270,472,28,105,'stone');B(1150,420,160,28,'glass');
 B(1095,335,250,25,'wood');B(1120,275,30,90,'wood');B(1290,275,30,90,'wood');B(1135,235,170,25,'stone');
 P(985,525,28);P(1230,525,28);P(1215,375,27);P(1215,205,26);
}
function B(px,py,w,h,k){blocks.push({x:px,y:py,w,h,k,hp:k==='stone'?4:k==='glass'?2:3,vx:0,vy:0,rot:0,vr:0,dead:false})}function P(px,py,r){pigs.push({x:px,y:py,r,vx:0,vy:0,alive:true,rot:0})}
function world(px,py){return{x:(px-OX)/S,y:(py-OY)/S}}function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#38b8ee');g.addColorStop(.58,'#b8e8f4');g.addColorStop(.59,'#d9eddf');g.addColorStop(1,'#75bc55');x.fillStyle=g;x.fillRect(0,0,W,H);cloud(130,120,1.25);cloud(480,165,.9);cloud(850,95,1.1);cloud(1180,150,.75);
 x.fillStyle='#8bc66d';x.beginPath();x.moveTo(0,565);for(let i=0;i<15;i++)x.quadraticCurveTo(i*100+50,500-(i%3)*25,i*100+100,565);x.lineTo(W,768);x.lineTo(0,768);x.fill();
 x.fillStyle='#62aa43';x.fillRect(0,625,W,143);x.fillStyle='#83c85a';x.beginPath();x.moveTo(0,625);for(let i=0;i<W;i+=34)x.quadraticCurveTo(i+17,607,i+34,625);x.lineTo(W,655);x.lineTo(0,655);x.fill();x.fillStyle='#8b5b36';x.fillRect(0,655,W,113);x.fillStyle='#68452e';for(let i=15;i<W;i+=43){x.beginPath();x.arc(i,675+(i%37),2.5,0,7);x.fill()}}
function cloud(a,b,s){x.save();x.globalAlpha=.62;x.fillStyle='#fff';x.beginPath();x.arc(a,b,30*s,0,7);x.arc(a+38*s,b-15*s,42*s,0,7);x.arc(a+82*s,b,30*s,0,7);x.fill();x.restore()}
function sling(){let a=210,b=625;x.lineCap='round';x.strokeStyle='#57351f';x.lineWidth=27;x.beginPath();x.moveTo(a-25,b+55);x.lineTo(a-15,b-50);x.moveTo(a+25,b+55);x.lineTo(a+15,b-50);x.stroke();x.strokeStyle='#9b5d2f';x.lineWidth=16;x.stroke();if(!bird.launched&&drag){x.strokeStyle='#3b2418';x.lineWidth=7;x.beginPath();x.moveTo(a-15,b-50);x.lineTo(bird.x,bird.y);x.moveTo(a+15,b-50);x.lineTo(bird.x,bird.y);x.stroke()}}
function red(){if(!bird.live)return;let a=bird.x,b=bird.y,r=bird.r;x.save();x.translate(a,b);if(bird.launched)x.rotate(Math.atan2(bird.vy,bird.vx)*.07);x.shadowColor='#52201555';x.shadowBlur=14;x.shadowOffsetY=8;let g=x.createRadialGradient(-15,-20,3,8,10,r*1.3);g.addColorStop(0,'#ff7966');g.addColorStop(.35,'#f04437');g.addColorStop(.78,'#d72f32');g.addColorStop(1,'#9f2028');x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;
 x.fillStyle='#b92a2e';x.beginPath();x.moveTo(-24,-8);x.lineTo(-67,-42);x.lineTo(-45,-1);x.lineTo(-70,35);x.lineTo(-24,20);x.closePath();x.fill();x.fillStyle='#f7dfc9';x.beginPath();x.ellipse(6,18,25,22,0,0,7);x.fill();
 x.strokeStyle='#29201d';x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(-25,-20);x.lineTo(-3,-29);x.moveTo(5,-29);x.lineTo(30,-20);x.stroke();x.fillStyle='#fff';x.beginPath();x.ellipse(-14,-5,12,17,0,0,7);x.ellipse(14,-5,12,17,0,0,7);x.fill();x.fillStyle='#191716';x.beginPath();x.arc(-10,-5,5.5,0,7);x.arc(18,-5,5.5,0,7);x.fill();
 x.fillStyle='#f6a91a';x.strokeStyle='#75410d';x.lineWidth=2.5;x.beginPath();x.moveTo(2,6);x.lineTo(42,12);x.lineTo(4,25);x.closePath();x.fill();x.stroke();x.beginPath();x.moveTo(7,16);x.lineTo(36,16);x.stroke();x.restore()}
function pig(p){if(!p.alive)return;let a=p.x,b=p.y,r=p.r;x.save();x.translate(a,b);x.shadowColor='#255b2b55';x.shadowBlur=10;x.shadowOffsetY=5;let g=x.createRadialGradient(-10,-14,2,0,0,r*1.25);g.addColorStop(0,'#c4ef83');g.addColorStop(.5,'#74cc4f');g.addColorStop(1,'#398d39');x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#4fa942';x.beginPath();x.ellipse(-r*.65,-r*.68,r*.28,r*.32,0,0,7);x.ellipse(r*.65,-r*.68,r*.28,r*.32,0,0,7);x.fill();x.fillStyle='#234520';x.beginPath();x.arc(-r*.3,-r*.18,4,0,7);x.arc(r*.3,-r*.18,4,0,7);x.fill();x.fillStyle='#a1df6a';x.beginPath();x.ellipse(0,r*.28,r*.47,r*.29,0,0,7);x.fill();x.strokeStyle='#3b6a30';x.lineWidth=2;x.stroke();x.fillStyle='#36562d';x.beginPath();x.arc(-r*.17,r*.28,4,0,7);x.arc(r*.17,r*.28,4,0,7);x.fill();x.restore()}
function block(b){if(b.dead)return;x.save();x.translate(b.x,b.y);x.rotate(b.rot);let g=x.createLinearGradient(0,0,b.w,b.h);if(b.k==='wood'){g.addColorStop(0,'#f4bf79');g.addColorStop(.45,'#d88c46');g.addColorStop(1,'#914c27')}else if(b.k==='stone'){g.addColorStop(0,'#e0e1dc');g.addColorStop(.5,'#aeb2ad');g.addColorStop(1,'#686e69')}else{g.addColorStop(0,'#eaffffcc');g.addColorStop(.5,'#83e2e8aa');g.addColorStop(1,'#35aeba99')}x.fillStyle=g;x.strokeStyle=b.k==='wood'?'#703b1e':b.k==='stone'?'#555a55':'#278c97';x.lineWidth=4;rr(0,0,b.w,b.h,5);x.fill();x.stroke();if(b.k==='wood'){x.strokeStyle='#75411f99';x.lineWidth=2;for(let y=12;y<b.h;y+=15){x.beginPath();x.moveTo(7,y);x.bezierCurveTo(b.w*.3,y-7,b.w*.7,y+6,b.w-7,y-2);x.stroke()}}if(b.k==='stone'){x.strokeStyle='#666b6677';for(let y=16;y<b.h;y+=22){x.beginPath();x.moveTo(5,y);x.lineTo(b.w-5,y+4);x.stroke()}}if(b.k==='glass'){x.strokeStyle='#fff9caaa';x.lineWidth=4;x.beginPath();x.moveTo(8,b.h-5);x.lineTo(b.w-8,7);x.stroke()}x.restore()}
function aim(){if(!drag)return;let dx=bird.x-210,dy=bird.y-575,vx=-dx*5.8,vy=-dy*5.8,px=bird.x,py=bird.y;for(let i=0;i<26;i++){px+=vx*.045;py+=vy*.045;vy+=.72;x.globalAlpha=1-i/28;x.fillStyle='#fff';x.beginPath();x.arc(px,py,3.2,0,7);x.fill()}x.globalAlpha=1}
function hit(){for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];if(b.dead)continue;let cx=cl(bird.x,b.x,b.x+b.w),cy=cl(bird.y,b.y,b.y+b.h),d=Math.hypot(bird.x-cx,bird.y-cy);if(d<bird.r){let power=Math.hypot(bird.vx,bird.vy)/10;b.hp-=Math.max(1,power*.18);b.vx+=bird.vx*.035;b.vy+=bird.vy*.035;b.vr+=(bird.vx*.0005);score+=50;burst(bird.x,bird.y,b.k);shake=7;if(b.hp<=0){b.dead=true;score+=100;burst(b.x+b.w/2,b.y+b.h/2,b.k)}break}}
 for(let p of pigs)if(p.alive&&Math.hypot(bird.x-p.x,bird.y-p.y)<bird.r+p.r){p.alive=false;score+=500;burst(p.x,p.y,'pig');shake=15}}
function burst(a,b,k){let col=k==='stone'?'#b8bbb5':k==='glass'?'#b9faff':k==='pig'?'#79d65a':'#ce8241';for(let i=0;i<18;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*260,vy:(Math.random()-.8)*260,s:2+Math.random()*6,t:1,c:col})}
function step(dt){if(state==='fly'){bird.vy+=720*dt;bird.x+=bird.vx*dt;bird.y+=bird.vy*dt;bird.vx*=.999;bird.vy*=.999;hit();if(bird.y>620){bird.y=620;bird.vy*=-.32;bird.vx*=.62;if(Math.abs(bird.vy)<45){bird.live=false;next()}}if(bird.x>1390||bird.y>800){bird.live=false;next()}}
 for(let b of blocks){if(b.dead)continue;b.vy+=500*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.985;b.vy*=.985;b.rot+=b.vr*dt;b.vr*=.985;if(b.y+b.h>655){b.y=655-b.h;b.vy*=-.15;b.vx*=.88} }
 for(let p of pigs)if(p.alive){p.vy+=500*dt;p.y+=p.vy*dt;if(p.y+p.r>655){p.y=655-p.r;p.vy=0}}
 for(let q of parts){q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=420*dt}parts=parts.filter(q=>q.t>0);shake=Math.max(0,shake-dt*20);
 if(state==='ready'&&pigs.every(p=>!p.alive)){state='win'} }
function next(){if(state!=='fly')return;shots--;if(pigs.every(p=>!p.alive)){state='win';return}if(shots<=0){state='lose';return}setTimeout(()=>{bird={x:208,y:566,r:39,vx:0,vy:0,live:true,launched:false};state='ready'},350)}
function hud(){x.save();x.fillStyle='#fff8e8e8';x.strokeStyle='#633e25';x.lineWidth=3;rr(22,18,220,55,17);x.fill();x.stroke();x.fillStyle='#4e321e';x.font='900 25px Arial';x.fillText('分数 '+score,42,54);x.font='900 18px Arial';x.fillText('剩余 '+shots+' 鸟',135,53);x.fillStyle='#fff8e8e8';rr(W-165,18,140,55,17);x.fill();x.stroke();x.fillStyle='#4e321e';x.font='900 20px Arial';x.fillText('↻ 重新开始',W-148,54);if(state==='win'||state==='lose'){x.fillStyle='#0008';x.fillRect(0,0,W,H);x.fillStyle='#fff8df';x.strokeStyle='#603c24';x.lineWidth=5;rr(420,245,526,230,28);x.fill();x.stroke();x.fillStyle='#4b301c';x.textAlign='center';x.font='900 48px Arial';x.fillText(state==='win'?'关卡完成！':'这次失败了',683,325);x.font='900 27px Arial';x.fillText('得分 '+score,683,372);x.font='900 20px Arial';x.fillText('点击右上角重新开始',683,418);x.textAlign='left'}x.restore()}
function draw(){x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);bg();for(let b of blocks)block(b);for(let p of pigs)pig(p);sling();aim();red();for(let q of parts){x.globalAlpha=Math.max(0,q.t);x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,q.s,0,7);x.fill()}x.globalAlpha=1;x.restore();hud()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{if(state!=='ready')return;let p=world(e.clientX,e.clientY);if(Math.hypot(p.x-bird.x,p.y-bird.y)<75){drag=true;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(!drag)return;let p=world(e.clientX,e.clientY);bird.x=cl(p.x,95,275);bird.y=cl(p.y,390,620);draw()});c.addEventListener('pointerup',e=>{if(!drag)return;drag=false;let dx=bird.x-210,dy=bird.y-575;bird.vx=-dx*5.9;bird.vy=-dy*5.9;bird.x=210;bird.y=575;bird.launched=true;state='fly'});c.addEventListener('pointercancel',()=>drag=false);c.addEventListener('click',e=>{let p=world(e.clientX,e.clientY);if(p.x>1190&&p.y<100)reset()});addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));fit();requestAnimationFrame(loop);
</script></body></html>
