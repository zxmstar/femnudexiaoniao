<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Furious Birds Classic</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none}body{position:fixed;inset:0;font-family:Arial,"Microsoft YaHei",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#zoom{position:fixed;right:12px;bottom:12px;z-index:5;display:flex;gap:5px;align-items:center;padding:6px 7px;border-radius:15px;background:#26343dcc;color:#fff;backdrop-filter:blur(10px)}#zoom button{border:0;border-radius:9px;width:36px;height:36px;background:#ffffff20;color:white;font-size:20px;font-weight:900}#zt{width:48px;text-align:center;font-size:11px;font-weight:900}</style></head><body><canvas id="c"></canvas><div id="zoom"><button id="minus">−</button><span id="zt">100%</span><button id="plus">＋</button><button id="lock">🔓</button></div><script>
'use strict';
const c=document.getElementById('c'),x=c.getContext('2d');const W=1280,H=720,G=612,A={x:185,y:535};let dpr,S,ox,oy,z=1,locked=false,mode='menu',score=0,birds=3,bird,pigs=[],blocks=[],fx=[],floats=[],clouds=[{x:80,y:90,s:1.1},{x:410,y:145,s:.75},{x:735,y:82,s:1.2},{x:1110,y:150,s:.8}],drag=false,pinch=null,t0=0,last=0;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),R=(a,b)=>a+Math.random()*(b-a),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){let w=innerWidth,h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);S=Math.min(w/W,h/H)*z;ox=(w-W*S)/2;oy=(h-H*S)/2;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
try{let q=JSON.parse(localStorage.fbView||'{}');z=clamp(q.z||1,.68,1.38);locked=!!q.locked}catch(e){}resize();addEventListener('resize',resize);function view(){document.getElementById('zt').textContent=Math.round(z*100)+'%';document.getElementById('lock').textContent=locked?'🔒':'🔓'}function zoom(v){if(locked)return;z=clamp(v,.68,1.38);localStorage.fbView=JSON.stringify({z,locked});resize();view()}document.getElementById('minus').onclick=()=>zoom(z-.08);document.getElementById('plus').onclick=()=>zoom(z+.08);document.getElementById('lock').onclick=()=>{locked=!locked;localStorage.fbView=JSON.stringify({z,locked});view()};view();
function wp(e){return{x:(e.clientX-ox)/S,y:(e.clientY-oy)/S}}
function rr(a,b,w,h,r=8){x.beginPath();x.roundRect(a,b,w,h,r)}function circ(a,b,r){x.beginPath();x.arc(a,b,r,0,Math.PI*2)}function ell(a,b,rx,ry,r=0){x.beginPath();x.ellipse(a,b,rx,ry,r,0,Math.PI*2)}
function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#43b9e7');g.addColorStop(.58,'#b8e8ee');g.addColorStop(1,'#80c95b');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#ffe979';circ(1060,85,32);x.fill();clouds.forEach(q=>{x.fillStyle='#fff';x.globalAlpha=.7;ell(q.x,q.y,48*q.s,22*q.s);x.fill();ell(q.x+40*q.s,q.y-14*q.s,40*q.s,29*q.s);x.fill();ell(q.x+79*q.s,q.y,44*q.s,21*q.s);x.fill()});x.globalAlpha=1;x.fillStyle='#93c985';x.beginPath();x.moveTo(0,515);x.quadraticCurveTo(180,425,355,515);x.quadraticCurveTo(540,430,735,515);x.quadraticCurveTo(980,405,1280,505);x.lineTo(1280,720);x.lineTo(0,720);x.fill();x.fillStyle='#65aa4c';x.beginPath();x.moveTo(0,570);x.quadraticCurveTo(160,480,370,555);x.quadraticCurveTo(590,475,780,560);x.quadraticCurveTo(1030,465,1280,545);x.lineTo(1280,720);x.lineTo(0,720);x.fill();x.fillStyle='#4f983e';x.fillRect(0,G,W,H-G);x.fillStyle='#79bd51';x.beginPath();x.moveTo(0,G);for(let i=0;i<W;i+=30)x.quadraticCurveTo(i+15,G-14,i+30,G);x.lineTo(W,G+22);x.lineTo(0,G+22);x.fill();x.fillStyle='#895a32';x.fillRect(0,650,W,70);for(let i=20;i<W;i+=47){x.fillStyle='#674225';circ(i,660+(i%27),2);x.fill()}}
function sling(){let sx=A.x,sy=585;x.lineCap='round';x.strokeStyle='#39231a';x.lineWidth=36;x.beginPath();x.moveTo(sx-24,632);x.lineTo(sx-14,480);x.moveTo(sx+24,632);x.lineTo(sx+14,480);x.stroke();x.strokeStyle='#9b5c2f';x.lineWidth=23;x.beginPath();x.moveTo(sx-24,632);x.lineTo(sx-14,480);x.moveTo(sx+24,632);x.lineTo(sx+14,480);x.stroke();if(bird&&!bird.fly&&bird.alive){x.strokeStyle='#33201e';x.lineWidth=7;x.beginPath();x.moveTo(sx-14,480);x.lineTo(bird.x,bird.y);x.moveTo(sx+14,480);x.lineTo(bird.x,bird.y);x.stroke()}}
function makeBird(){bird={x:A.x,y:A.y,r:38,vx:0,vy:0,fly:false,alive:true,age:0}}
function B(x0,y0,w,h,t){blocks.push({x:x0,y:y0,w,h,t,hp:t==='stone'?70:t==='glass'?28:45,vx:0,vy:0,dead:false,rot:0})}function P(px,py,r=29){pigs.push({x:px,y:py,r,vy:0,vx:0,alive:true})}
function level(){blocks=[];pigs=[];B(760,560,34,150,'wood');B(1000,560,34,150,'wood');B(780,485,214,34,'wood');B(805,397,32,88,'stone');B(937,397,32,88,'stone');B(792,350,196,34,'glass');P(895,535);B(1080,560,34,150,'wood');B(1240,560,34,150,'wood');B(1100,485,158,34,'wood');B(1115,397,32,88,'stone');B(1207,397,32,88,'stone');B(1095,350,180,34,'glass');P(1175,535);B(900,294,34,90,'wood');B(1050,294,34,90,'wood');B(925,258,134,34,'stone');P(992,220,27)}
function reset(){mode='ready';score=0;birds=3;fx=[];floats=[];level();makeBird();t0=performance.now()}
function drawBird(){if(!bird?.alive)return;x.save();x.translate(bird.x,bird.y);x.rotate(bird.fly?Math.atan2(bird.vy,bird.vx)*.06:0);x.fillStyle='#161516';x.beginPath();x.moveTo(-25,8);x.lineTo(-67,-28);x.lineTo(-49,7);x.lineTo(-73,36);x.lineTo(-22,23);x.closePath();x.fill();x.beginPath();x.moveTo(-28,14);x.lineTo(-69,5);x.lineTo(-50,26);x.lineTo(-58,49);x.lineTo(-18,26);x.closePath();x.fill();let g=x.createRadialGradient(-15,-18,3,5,5,55);g.addColorStop(0,'#ff7b64');g.addColorStop(.5,'#ed443a');g.addColorStop(1,'#a5222b');x.fillStyle=g;circ(0,0,43);x.fill();x.fillStyle='#b3262d';x.beginPath();x.moveTo(-19,-39);x.lineTo(-28,-76);x.lineTo(-5,-52);x.lineTo(15,-78);x.lineTo(17,-38);x.closePath();x.fill();x.fillStyle='#f0ceb0';x.beginPath();x.ellipse(4,25,27,19,0,0,Math.PI*2);x.fill();x.strokeStyle='#171516';x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(-29,-19);x.lineTo(-5,-29);x.moveTo(6,-29);x.lineTo(30,-19);x.stroke();x.fillStyle='#fff';ell(-14,-5,12,15);x.fill();ell(15,-5,12,15);x.fillStyle='#151515';ell(-10,-3,5,8);x.fill();ell(19,-3,5,8);x.fill();x.fillStyle='#f5ae18';x.strokeStyle='#704516';x.lineWidth=2;x.beginPath();x.moveTo(-2,8);x.lineTo(43,12);x.lineTo(5,28);x.closePath();x.fill();x.stroke();x.restore()}
function pig(p){if(!p.alive)return;x.save();x.translate(p.x,p.y);let g=x.createRadialGradient(-10,-13,2,0,0,p.r);g.addColorStop(0,'#d8fa98');g.addColorStop(.55,'#80cf58');g.addColorStop(1,'#398d40');x.fillStyle=g;ell(0,0,p.r,p.r*.92);x.fill();x.fillStyle='#64b74d';ell(-17,-24,9,12);x.fill();ell(17,-24,9,12);x.fill();x.fillStyle='#fff';ell(-10,-7,8,10);x.fill();ell(10,-7,8,10);x.fill();x.fillStyle='#20231d';circ(-8,-6,3.7);x.fill();circ(12,-6,3.7);x.fill();x.fillStyle='#7cbe59';x.strokeStyle='#317638';x.lineWidth=3;ell(0,12,17,12);x.fill();x.stroke();x.fillStyle='#315d31';circ(-7,12,3.3);x.fill();circ(7,12,3.3);x.fill();x.restore()}
function block(b){if(b.dead)return;x.save();x.translate(b.x+b.w/2,b.y+b.h/2);x.rotate(b.rot);let fill,stroke;if(b.t==='wood'){fill='#c98b4e';stroke='#75451f'}else if(b.t==='stone'){fill='#aaa69d';stroke='#5c5b57'}else{fill='rgba(126,214,238,.55)';stroke='#367f9d'}x.fillStyle=fill;x.strokeStyle=stroke;x.lineWidth=4;rr(-b.w/2,-b.h/2,b.w,b.h,7);x.fill();x.stroke();if(b.t==='wood'){x.strokeStyle='rgba(91,51,26,.45)';x.lineWidth=2;for(let y=-b.h/2+9;y<b.h/2;y+=15){x.beginPath();x.moveTo(-b.w/2+5,y);x.quadraticCurveTo(0,y+4,b.w/2-5,y-2);x.stroke()}}if(b.t==='glass'){x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=3;x.beginPath();x.moveTo(-b.w*.28,-b.h*.4);x.lineTo(b.w*.2,b.h*.38);x.stroke()}x.restore()}
function trajectory(){if(!drag||bird.fly)return;let dx=A.x-bird.x,dy=A.y-bird.y,vx=dx*3.1,vy=dy*3.1;x.fillStyle='rgba(255,255,255,.82)';for(let i=1;i<18;i++){let tt=i*.13,px=A.x+vx*tt,py=A.y+vy*tt+490*tt*tt/2;circ(px,py,3.2);x.fill()}}
function burst(px,py,n=12){for(let i=0;i<n;i++)fx.push({x:px,y:py,vx:R(-230,230),vy:R(-260,80),life:R(.3,.7),s:R(2,6),col:Math.random()<.5?'#fff2a3':'#fff'})}
function hit(px,py,pts){score+=pts;floats.push({x:px,y:py,t:'+'+pts,a:1});burst(px,py,10)}
function collide(){for(const p of pigs){if(!p.alive)continue;if(D(bird,p)<bird.r+p.r){p.alive=false;hit(p.x,p.y,500);bird.vx*=.55;bird.vy*=.55;}}for(const b of blocks){if(b.dead)continue;let cx=clamp(bird.x,b.x,b.x+b.w),cy=clamp(bird.y,b.y,b.y+b.h),d=Math.hypot(bird.x-cx,bird.y-cy);if(d<bird.r){let power=Math.hypot(bird.vx,bird.vy);b.hp-=power*.018;if(b.hp<=0){b.dead=true;hit(b.x+b.w/2,b.y+b.h/2,b.t==='stone'?200:b.t==='wood'?100:50);burst(b.x+b.w/2,b.y+b.h/2,18)}else{burst(bird.x,bird.y,5)}bird.vx*=.68;bird.vy*=.68;}}}
function physics(dt){if(mode!=='play')return;dt=Math.min(dt,.025);if(bird.fly&&bird.alive){bird.age+=dt;bird.vy+=980*dt;bird.vx*=Math.pow(.999,dt*60);bird.x+=bird.vx*dt;bird.y+=bird.vy*dt;collide();if(bird.y+bird.r>G){bird.y=G-bird.r;bird.vy*=-.25;bird.vx*=.75;if(Math.hypot(bird.vx,bird.vy)<90)bird.alive=false}if(bird.x>W+80||bird.y>H+100||bird.age>7)bird.alive=false}
for(const b of blocks)if(!b.dead){b.vy+=980*dt;b.y+=b.vy*dt;if(b.y+b.h>G){b.y=G-b.h;b.vy*=-.18;b.vx*=.7}for(const q of blocks)if(q!==b&&!q.dead&&Math.abs((b.x+b.w/2)-(q.x+q.w/2))<(b.w+q.w)/2*.8&&Math.abs((b.y+b.h)-(q.y))<8&&b.vy>0){b.y=q.y-b.h;b.vy=0}}for(const p of pigs)if(p.alive){p.vy+=980*dt;p.y+=p.vy*dt;if(p.y+p.r>G){p.y=G-p.r;p.vy*=-.15;if(Math.abs(p.vy)<40)p.vy=0}}
for(let i=fx.length-1;i>=0;i--){let f=fx[i];f.vy+=500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;if(f.life<=0)fx.splice(i,1)}for(let i=floats.length-1;i>=0;i--){floats[i].y-=35*dt;floats[i].a-=dt;if(floats[i].a<=0)floats.splice(i,1)}if(!bird.alive){if(pigs.some(p=>p.alive)){if(birds>0){birds--;makeBird();mode='ready'}else mode='lose'}else mode='win'}if(!pigs.some(p=>p.alive)&&mode==='play')mode='win'}
function hud(){x.fillStyle='#fff8dc';x.strokeStyle='#704526';x.lineWidth=3;rr(28,24,300,58,15);x.fill();x.stroke();x.fillStyle='#633d25';x.font='900 22px Arial';x.fillText('关卡 1-1',47,61);x.font='900 20px Arial';x.fillText('分数 '+score,158,61);for(let i=0;i<birds;i++){x.save();x.translate(350+i*48,53);x.fillStyle='#e64238';circ(0,0,17);x.fill();x.fillStyle='#fff';circ(-5,-3,5);x.fill();circ(6,-3,5);x.fill();x.restore()}x.fillStyle='#fff8dc';x.strokeStyle='#704526';rr(1138,25,105,50,14);x.fill();x.stroke();x.fillStyle='#633d25';x.font='900 18px Arial';x.fillText('↻ 重玩',1155,58)}
function panel(title,sub,button){x.fillStyle='rgba(22,38,44,.42)';x.fillRect(0,0,W,H);x.fillStyle='#fff8df';x.strokeStyle='#704526';x.lineWidth=5;rr(390,145,500,390,28);x.fill();x.stroke();x.fillStyle='#6b4026';x.textAlign='center';x.font='900 55px Arial';x.fillText(title,640,235);x.font='700 24px Arial';x.fillText(sub,640,290);x.fillStyle='#f0b42c';x.strokeStyle='#704526';rr(510,365,260,72,20);x.fill();x.stroke();x.fillStyle='#5b351f';x.font='900 29px Arial';x.fillText(button,640,412);x.font='700 18px Arial';x.fillText('拖住小鸟向后拉，松手发射',640,480);x.textAlign='left'}
function draw(){bg();blocks.forEach(block);pigs.forEach(pig);sling();trajectory();drawBird();fx.forEach(f=>{x.globalAlpha=clamp(f.life*2,0,1);x.fillStyle=f.col;circ(f.x,f.y,f.s);x.fill();x.globalAlpha=1});floats.forEach(f=>{x.globalAlpha=f.a;x.fillStyle='#ffe15a';x.strokeStyle='#6c3f20';x.lineWidth=4;x.font='900 25px Arial';x.strokeText(f.t,f.x,f.y);x.fillText(f.t,f.x,f.y);x.globalAlpha=1});if(mode!=='menu')hud();if(mode==='menu')panel('愤怒的小鸟','经典弹弓物理关卡 · 第一关','开始游戏');if(mode==='win')panel('关卡完成！','得分 '+score+'  ·  剩余小鸟 '+birds,'再玩一次');if(mode==='lose')panel('挑战失败','别急，瞄准支撑点再试一次','重新挑战');}
function loop(t){let dt=(t-last)/1000||0;last=t;physics(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function down(e){e.preventDefault();let p=wp(e);if(e.pointerId!==undefined){c.setPointerCapture?.(e.pointerId)}if(mode==='menu'){if(p.x>450&&p.x<830&&p.y>330&&p.y<460)reset();return}if(mode==='win'||mode==='lose'){if(p.x>450&&p.x<830&&p.y>330&&p.y<460)reset();return}if(p.x>1120&&p.y<90){reset();return}if(mode==='ready'&&D(p,bird)<70){drag=true;mode='ready';return}}
function move(e){e.preventDefault();if(!drag||bird.fly)return;let p=wp(e),dx=p.x-A.x,dy=p.y-A.y,len=Math.hypot(dx,dy);if(len>200){dx*=200/len;dy*=200/len}bird.x=A.x+dx;bird.y=A.y+dy}
function up(e){e.preventDefault();if(!drag)return;drag=false;let dx=A.x-bird.x,dy=A.y-bird.y;if(Math.hypot(dx,dy)<12){bird.x=A.x;bird.y=A.y;return}bird.vx=dx*3.1;bird.vy=dy*3.1;bird.fly=true;bird.age=0;mode='play'}
c.addEventListener('pointerdown',down,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',up,{passive:false});c.addEventListener('pointercancel',up,{passive:false});
</script></body></html>
