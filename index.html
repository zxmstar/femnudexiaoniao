<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8bd7ff">
<title>Angry Birds · Mobile Web</title>
<style>
:root{--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#80d3ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}body{user-select:none;-webkit-user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;top:calc(var(--safe-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;z-index:4;pointer-events:none}.brand,.scorebox{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:18px;background:rgba(24,49,67,.62);border:1px solid rgba(255,255,255,.34);box-shadow:0 8px 24px rgba(21,61,80,.18),inset 0 1px rgba(255,255,255,.16);color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.28);backdrop-filter:blur(10px)}.brand{font-weight:900;font-size:16px}.logoBird{width:29px;height:29px;display:block}.scorebox{font-weight:850;font-size:14px}.scorebox span{font-variant-numeric:tabular-nums}.controls{position:fixed;right:12px;bottom:calc(var(--safe-bottom) + 12px);z-index:4;display:flex;gap:9px}.btn{border:0;padding:11px 14px;border-radius:15px;background:rgba(255,255,255,.92);color:#2b4655;font-weight:900;font-size:14px;box-shadow:0 7px 0 rgba(71,91,99,.28),0 11px 26px rgba(0,0,0,.12);cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(71,91,99,.28),0 7px 18px rgba(0,0,0,.1)}.hint{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 19px);transform:translateX(-50%);z-index:4;padding:8px 13px;border-radius:16px;background:rgba(24,49,67,.66);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:13px;white-space:nowrap;box-shadow:0 7px 24px rgba(0,0,0,.12);transition:.25s}.hint.hide{opacity:0;pointer-events:none}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:linear-gradient(rgba(13,48,68,.14),rgba(13,48,68,.42));padding:24px}.modal.hide{display:none}.card{width:min(92vw,430px);padding:26px 24px 25px;border-radius:31px;background:linear-gradient(#fff,#f8fbfc);box-shadow:0 24px 70px rgba(28,63,80,.3),inset 0 1px #fff;color:#294653;text-align:center;border:1px solid rgba(255,255,255,.85)}.heroBird{width:104px;height:104px;margin:0 auto 7px;filter:drop-shadow(0 11px 10px rgba(72,62,47,.24))}.card h1{margin:2px 0 6px;font-size:31px;letter-spacing:-.6px}.card p{margin:0 auto 18px;max-width:330px;line-height:1.65;color:#607683;font-size:14px}.start{border:0;border-radius:17px;padding:14px 28px;background:linear-gradient(#f45b4c,#d9342d);color:#fff;font-size:17px;font-weight:950;box-shadow:0 7px 0 #ad2924,0 13px 25px rgba(217,52,45,.25);cursor:pointer}.stars{color:#f5bd2e;font-size:24px;letter-spacing:3px;text-shadow:0 2px 0 #d89c1c;margin-bottom:2px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="brand"><svg class="logoBird" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="33" fill="#e43d32"/><path d="M18 36c14-19 33-27 61-18" fill="none" stroke="#2c2624" stroke-width="10" stroke-linecap="round"/><path d="M39 47L68 52 41 59Z" fill="#f1a31c" stroke="#6e3714" stroke-width="2"/><circle cx="41" cy="47" r="7" fill="#fff"/><circle cx="59" cy="46" r="7" fill="#fff"/><circle cx="43" cy="48" r="3.2"/><circle cx="61" cy="47" r="3.2"/><path d="M26 70c8-2 19-2 27 3" fill="none" stroke="#f5d8bd" stroke-width="8" stroke-linecap="round"/></svg><span>小鸟挑战</span></div><div class="scorebox">⭐ <span id="score">0</span>&nbsp;&nbsp;🏆 <span id="best">0</span></div></div>
<div id="hint" class="hint">拖动红色小鸟，瞄准后松手发射</div>
<div class="controls"><button class="btn" id="reset">↻ 重来</button></div>
<div id="modal" class="modal"><div class="card"><div class="stars">★★★</div><svg class="heroBird" viewBox="0 0 160 160"><defs><radialGradient id="rb" cx="34%" cy="28%"><stop offset="0" stop-color="#ff6c58"/><stop offset=".58" stop-color="#e84237"/><stop offset="1" stop-color="#be2627"/></radialGradient><linearGradient id="beak" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc43b"/><stop offset="1" stop-color="#e4860a"/></linearGradient></defs><ellipse cx="80" cy="145" rx="39" ry="7" fill="#000" opacity=".10"/><circle cx="80" cy="80" r="54" fill="url(#rb)" stroke="#7d2927" stroke-width="3"/><path d="M34 53c11-27 37-39 73-34" fill="none" stroke="#2c2523" stroke-width="17" stroke-linecap="round"/><path d="M53 44l37 6-34 14z" fill="#fff" opacity=".20"/><ellipse cx="63" cy="72" rx="14" ry="18" fill="#fff"/><ellipse cx="97" cy="72" rx="14" ry="18" fill="#fff"/><circle cx="66" cy="74" r="6"/><circle cx="100" cy="74" r="6"/><path d="M76 79l46 8-44 15z" fill="url(#beak)" stroke="#8f4c15" stroke-width="3"/><path d="M56 113c16-9 34-9 49 0" fill="none" stroke="#f6dbbf" stroke-width="13" stroke-linecap="round"/></svg><h1 id="title">愤怒的小鸟</h1><p id="desc">经典弹弓玩法。拉开橡皮筋，控制方向和力度，击倒绿色小猪并摧毁建筑。</p><button id="start" class="start">开始游戏</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1,ground=0,started=false,drag=false,last=0,score=0,best=Number(localStorage.getItem('birdBest')||0),bird,blocks=[],pigs=[],parts=[],clouds=[],shake=0,wonShown=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ground=H*.79;ctx.setTransform(DPR,0,0,DPR,0,0);makeClouds();reset(false)}
addEventListener('resize',resize);
function sx(){return Math.min(W/920,H/620)}
function anchor(){return {x:Math.max(105,W*.14),y:ground-94}}
function reset(hide=true){const a=anchor();score=0;document.getElementById('score').textContent='0';bird={x:a.x,y:a.y,r:26,vx:0,vy:0,launched:false,alive:true,trail:[]};const baseX=Math.max(W*.59,520);blocks=[
{x:baseX,y:ground-94,w:30,h:94,hp:2,kind:'wood'},
{x:baseX+112,y:ground-94,w:30,h:94,hp:2,kind:'wood'},
{x:baseX+24,y:ground-190,w:94,h:27,hp:2,kind:'wood'},
{x:baseX+160,y:ground-170,w:30,h:76,hp:2,kind:'stone'},
{x:baseX+220,y:ground-94,w:30,h:94,hp:2,kind:'wood'},
{x:baseX+136,y:ground-258,w:114,h:27,hp:3,kind:'wood'}];pigs=[{x:baseX+63,y:ground-125,r:25,alive:true},{x:baseX+190,y:ground-292,r:23,alive:true}];parts=[];shake=0;wonShown=false;if(hide)document.getElementById('modal').classList.add('hide');draw()}
function makeClouds(){clouds=Array.from({length:8},(_,i)=>({x:(i*180+70)%Math.max(W,700),y:70+(i%3)*62,s:.7+(i%3)*.18,spd:.008+i*.001}))}
function sky(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#72c9f7');g.addColorStop(.55,'#aee8ff');g.addColorStop(.79,'#d8f4ff');g.addColorStop(.80,'#77c35a');g.addColorStop(1,'#3f9637');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.save();ctx.globalAlpha=.38;for(let i=0;i<clouds.length;i++){const c=clouds[i];let cx=(c.x+performance.now()*c.spd)% (W+180)-90;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,c.y,24*c.s,0,Math.PI*2);ctx.arc(cx+30*c.s,c.y-10*c.s,31*c.s,0,Math.PI*2);ctx.arc(cx+65*c.s,c.y,22*c.s,0,Math.PI*2);ctx.fill()}ctx.restore();
// distant hills
ctx.fillStyle='#72bd64';ctx.beginPath();ctx.moveTo(0,ground+5);for(let xx=0;xx<=W;xx+=60){ctx.quadraticCurveTo(xx+30,ground-26-(xx%140)*.08,xx+60,ground+5)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
ctx.fillStyle='#4a9f3d';ctx.fillRect(0,ground,W,H-ground);
ctx.fillStyle='#388730';for(let i=0;i<W;i+=36){ctx.fillRect(i,ground+7,2,15);ctx.fillRect(i+13,ground+12,1.5,10)}
}
function sling(){const a=anchor();ctx.save();ctx.lineCap='round';ctx.lineWidth=14;ctx.strokeStyle='#623a23';ctx.beginPath();ctx.moveTo(a.x-17,ground+4);ctx.lineTo(a.x-7,ground-58);ctx.moveTo(a.x+20,ground+4);ctx.lineTo(a.x+9,ground-58);ctx.stroke();ctx.lineWidth=9;ctx.strokeStyle='#9a5e32';ctx.beginPath();ctx.moveTo(a.x-18,ground+4);ctx.lineTo(a.x-8,ground-58);ctx.moveTo(a.x+19,ground+4);ctx.lineTo(a.x+10,ground-58);ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle='#4a2920';ctx.beginPath();const bx=drag?bird.x:a.x,by=drag?bird.y:a.y;ctx.moveTo(a.x-7,ground-58);ctx.lineTo(bx,by);ctx.moveTo(a.x+9,ground-58);ctx.lineTo(bx,by);ctx.stroke();ctx.restore()}
function drawBird(){const b=bird;ctx.save();ctx.translate(b.x,b.y);let ang=b.launched?Math.atan2(b.vy,b.vx)*.075:0;ctx.rotate(ang);ctx.shadowColor='rgba(75,33,30,.25)';ctx.shadowBlur=8;ctx.shadowOffsetY=5;const grad=ctx.createRadialGradient(-9,-12,2,5,5,b.r*1.6);grad.addColorStop(0,'#ff6a57');grad.addColorStop(.55,'#e94438');grad.addColorStop(1,'#b92728');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
ctx.fillStyle='#f6dbc3';ctx.beginPath();ctx.ellipse(4,10,15,12,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#292321';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-17,-19);ctx.quadraticCurveTo(-9,-28,0,-24);ctx.moveTo(7,-24);ctx.quadraticCurveTo(15,-28,21,-19);ctx.stroke();
ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-8,-6,9,11,0,0,Math.PI*2);ctx.ellipse(9,-6,9,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1e1b1a';ctx.beginPath();ctx.arc(-6,-5,3.3,0,Math.PI*2);ctx.arc(10,-5,3.3,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#f4a61a';ctx.strokeStyle='#8b4d13';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(7,1);ctx.lineTo(31,7);ctx.lineTo(7,14);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawPig(p){if(!p.alive)return;ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor='rgba(47,95,40,.24)';ctx.shadowBlur=8;ctx.shadowOffsetY=5;const g=ctx.createRadialGradient(-7,-8,2,4,4,p.r*1.25);g.addColorStop(0,'#9de46c');g.addColorStop(.6,'#62c84f');g.addColorStop(1,'#3f9f3a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#7ed65a';ctx.beginPath();ctx.ellipse(0,10,12,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#244324';ctx.beginPath();ctx.arc(-8,-6,3,0,7);ctx.arc(8,-6,3,0,7);ctx.fill();ctx.strokeStyle='#315326';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,10);ctx.quadraticCurveTo(0,13,6,10);ctx.stroke();ctx.strokeStyle='#7fae59';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-11,-21);ctx.lineTo(-5,-14);ctx.moveTo(11,-21);ctx.lineTo(5,-14);ctx.stroke();ctx.restore()}
function drawBlock(b){ctx.save();ctx.translate(b.x,b.y);const grad=ctx.createLinearGradient(0,0,b.w,b.h);if(b.kind==='stone'){grad.addColorStop(0,'#cdd3d0');grad.addColorStop(.5,'#a4aaa7');grad.addColorStop(1,'#747a77')}else{grad.addColorStop(0,'#c5823e');grad.addColorStop(.48,'#a96530');grad.addColorStop(1,'#7e481f')}ctx.fillStyle=grad;ctx.strokeStyle=b.kind==='stone'?'#626865':'#603617';ctx.lineWidth=3;ctx.shadowColor='rgba(51,42,28,.25)';ctx.shadowBlur=6;ctx.shadowOffsetY=4;ctx.fillRect(0,0,b.w,b.h);ctx.strokeRect(1.5,1.5,b.w-3,b.h-3);ctx.shadowBlur=0;ctx.globalAlpha=.35;ctx.strokeStyle='#fff';ctx.lineWidth=1.4;ctx.beginPath();if(b.kind==='wood'){ctx.moveTo(5,9);ctx.lineTo(b.w-5,b.h-12);ctx.moveTo(b.w-6,9);ctx.lineTo(6,b.h-12)}else{ctx.moveTo(5,b.h*.25);ctx.lineTo(b.w-5,b.h*.68);ctx.moveTo(b.w*.2,b.h-4);ctx.lineTo(b.w*.8,4)}ctx.stroke();ctx.restore()}
function trajectory(){if(!drag||bird.launched)return;const a=anchor(),dx=bird.x-a.x,dy=bird.y-a.y;let vx=-dx*5.8,vy=-dy*5.8,px=a.x,py=a.y;for(let i=0;i<28;i++){px+=vx*.055;py+=vy*.055;vy+=700*.055*.055; if(py>ground)break;if(i%2===0){ctx.globalAlpha=.78-i*.018;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,2.8,0,7);ctx.fill()}}ctx.globalAlpha=1}
function particles(x,y,color,amount=18){for(let i=0;i<amount;i++)parts.push({x,y,vx:(Math.random()-.5)*320,vy:(Math.random()-.65)*320,s:2+Math.random()*5,life:.9+Math.random()*.45,color})}
function hit(){for(let i=blocks.length-1;i>=0;i--){const b=blocks[i];if(b.hp<=0)continue;const nearX=clamp(bird.x,b.x,b.x+b.w),nearY=clamp(bird.y,b.y,b.y+b.h);if(Math.hypot(bird.x-nearX,bird.y-nearY)<bird.r){b.hp--;score+=60;particles(bird.x,bird.y,b.kind==='stone'?'#b9c2bf':'#c98540',16);shake=6;if(b.hp<=0){score+=90;particles(b.x+b.w/2,b.y+b.h/2,b.kind==='stone'?'#aeb4b1':'#be7337',22);blocks.splice(i,1)}break}}
for(const p of pigs){if(p.alive&&Math.hypot(bird.x-p.x,bird.y-p.y)<bird.r+p.r){p.alive=false;score+=500;particles(p.x,p.y,'#6fd457',28);shake=11}}
updateScore()}
function updateScore(){document.getElementById('score').textContent=score;if(score>best){best=score;localStorage.setItem('birdBest',best);document.getElementById('best').textContent=best}}
function physics(dt){if(!bird.launched)return;bird.vy+=710*dt;bird.x+=bird.vx*dt;bird.y+=bird.vy*dt;bird.vx*=.998;bird.trail.push({x:bird.x,y:bird.y,a:1});if(bird.trail.length>14)bird.trail.shift();hit();if(bird.y+bird.r>ground){bird.y=ground-bird.r;bird.vy*=-.43;bird.vx*=.6;if(Math.abs(bird.vy)<42&&Math.abs(bird.vx)<48)bird.alive=false}if(bird.x>W+100||bird.y>H+120)bird.alive=false;if(!bird.alive&&pigs.every(p=>!p.alive)&&!wonShown){wonShown=true;setTimeout(showWin,420)}
if(!bird.alive&&pigs.some(p=>p.alive)&&blocks.length>0){setTimeout(()=>{const a=anchor();if(!started)return;bird={x:a.x,y:a.y,r:26,vx:0,vy:0,launched:false,alive:true,trail:[]}},280)}}
function showWin(){document.getElementById('modal').classList.remove('hide');document.getElementById('title').textContent='完美命中！';document.getElementById('desc').textContent='小猪全部击败。你的本局得分：'+score+'，还能继续刷新最高分。'}
function render(){ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);sky();sling();trajectory();bird.trail.forEach((t,i)=>{ctx.globalAlpha=(i/bird.trail.length)*.12;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t.x,t.y,4,0,7);ctx.fill()});ctx.globalAlpha=1;blocks.forEach(drawBlock);pigs.forEach(drawPig);if(bird.alive)drawBird();for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}
function tick(t){const dt=Math.min((t-last)/1000,.033);last=t;if(started){physics(dt);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt*1.35}parts=parts.filter(p=>p.life>0);shake*=.9;render()}requestAnimationFrame(tick)}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left),y:(e.clientY-r.top)}}
canvas.addEventListener('pointerdown',e=>{if(!started||bird.launched||!bird.alive)return;const p=point(e);if(Math.hypot(p.x-bird.x,p.y-bird.y)<62){drag=true;canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),a=anchor();bird.x=clamp(p.x,a.x-105,a.x+25);bird.y=clamp(p.y,a.y-110,a.y+105)});
canvas.addEventListener('pointerup',()=>{if(!drag)return;drag=false;const a=anchor(),dx=bird.x-a.x,dy=bird.y-a.y;bird.x=a.x;bird.y=a.y;bird.vx=-dx*5.8;bird.vy=-dy*5.8;bird.launched=true;document.getElementById('hint').classList.add('hide')});
document.getElementById('start').onclick=()=>{started=true;document.getElementById('modal').classList.add('hide');document.getElementById('hint').classList.remove('hide');reset(false)};
document.getElementById('reset').onclick=()=>{started=true;document.getElementById('modal').classList.add('hide');document.getElementById('hint').classList.remove('hide');reset(false)};
document.getElementById('best').textContent=best;resize();requestAnimationFrame(tick);
</script>
</body>
</html>
