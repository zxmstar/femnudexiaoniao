<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>愤怒的小鸟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;user-select:none}body{position:fixed;inset:0}#game{position:absolute;inset:0;display:grid;place-items:center;background:#111}canvas{display:block;touch-action:none;width:100%;height:100%}
</style>
</head>
<body><div id="game"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
'use strict';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=1280,H=720,GROUND=640,DT=1/60,G=1400,MAXV=2400,MAXDRAG=220;
let scale=1,ox=0,oy=0,mode='start',score=0,birdsLeft=3,bird=null,pigs=[],blocks=[],particles=[],texts=[],dragging=false,last=0,acc=0,resultTimer=0,shotSettled=false;
const sling={x:180,y:520};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){const w=innerWidth,h=innerHeight;scale=Math.min(w/W,h/H);ox=(w-W*scale)/2;oy=(h-H*scale)/2;c.style.width=(W*scale)+'px';c.style.height=(H*scale)+'px';}
addEventListener('resize',resize);resize();
function worldPoint(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
function reset(){score=0;birdsLeft=3;mode='playing';resultTimer=0;shotSettled=false;particles=[];texts=[];buildLevel();spawnBird()}
function buildLevel(){
 blocks=[];pigs=[];
 block(700,580,120,60,'stone');block(820,580,120,60,'stone');
 block(700,520,40,60,'wood');block(780,520,40,60,'wood');block(860,520,40,60,'wood');block(900,520,40,60,'wood');
 block(720,460,220,40,'wood');
 block(740,400,40,60,'glass');block(860,400,40,60,'glass');
 block(760,360,120,40,'wood');
 pig(760,560,28);pig(760,380,28);
}
function block(x,y,w,h,mat){blocks.push({x,y,w,h,mat,hp:mat==='stone'?95:mat==='glass'?35:55,vx:0,vy:0,dead:false,grounded:false})}
function pig(x,y,r){pigs.push({x,y,r,vx:0,vy:0,alive:true,stun:0})}
function spawnBird(){bird={x:180,y:470,r:38,vx:0,vy:0,fly:false,alive:true,age:0,rest:0}}
function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4A90E2');g.addColorStop(1,'#87CEEB');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#fff';ctx.globalAlpha=.8;[[120,100,1],[430,135,.75],[760,85,1.2],[1080,135,.8]].forEach(([x,y,s])=>{ctx.beginPath();ctx.arc(x,y,28*s,0,Math.PI*2);ctx.arc(x+32*s,y-12*s,38*s,0,Math.PI*2);ctx.arc(x+70*s,y,25*s,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
 ctx.fillStyle='#8bc878';ctx.beginPath();ctx.moveTo(0,530);ctx.quadraticCurveTo(200,420,400,530);ctx.quadraticCurveTo(620,410,820,530);ctx.quadraticCurveTo(1050,425,1280,515);ctx.lineTo(1280,GROUND);ctx.lineTo(0,GROUND);ctx.fill();
 ctx.fillStyle='#59a847';ctx.beginPath();ctx.moveTo(0,585);ctx.quadraticCurveTo(180,500,390,580);ctx.quadraticCurveTo(620,490,850,580);ctx.quadraticCurveTo(1060,500,1280,575);ctx.lineTo(1280,GROUND);ctx.lineTo(0,GROUND);ctx.fill();
 ctx.fillStyle='#65a844';ctx.fillRect(0,GROUND,W,10);ctx.fillStyle='#87562f';ctx.fillRect(0,650,W,70);
 for(let i=20;i<W;i+=48){ctx.fillStyle='#6d4527';ctx.beginPath();ctx.arc(i,670+(i%23),2,0,Math.PI*2);ctx.fill()}
}
function drawSling(){const x=sling.x;ctx.lineCap='round';ctx.strokeStyle='#3a2419';ctx.lineWidth=38;ctx.beginPath();ctx.moveTo(x-25,640);ctx.lineTo(x-15,500);ctx.moveTo(x+25,640);ctx.lineTo(x+15,500);ctx.stroke();ctx.strokeStyle='#9b5d32';ctx.lineWidth=25;ctx.beginPath();ctx.moveTo(x-25,640);ctx.lineTo(x-15,500);ctx.moveTo(x+25,640);ctx.lineTo(x+15,500);ctx.stroke();
 if(bird&&bird.alive&&!bird.fly){ctx.strokeStyle='#241817';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x-15,500);ctx.lineTo(bird.x,bird.y);ctx.moveTo(x+15,500);ctx.lineTo(bird.x,bird.y);ctx.stroke()}}
function drawBird(b){if(!b||!b.alive)return;ctx.save();ctx.translate(b.x,b.y);if(b.fly)ctx.rotate(Math.atan2(b.vy,b.vx)*.06);ctx.strokeStyle='#171717';ctx.lineWidth=4;
 ctx.fillStyle='#151515';ctx.beginPath();ctx.moveTo(-22,15);ctx.lineTo(-68,-18);ctx.lineTo(-47,18);ctx.lineTo(-68,43);ctx.lineTo(-17,27);ctx.closePath();ctx.fill();
 const rg=ctx.createRadialGradient(-12,-18,3,5,5,48);rg.addColorStop(0,'#ff7160');rg.addColorStop(.55,'#e53b35');rg.addColorStop(1,'#a91f29');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,42,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle='#b72b31';ctx.beginPath();ctx.moveTo(-20,-39);ctx.lineTo(-28,-73);ctx.lineTo(-6,-51);ctx.lineTo(14,-74);ctx.lineTo(16,-39);ctx.closePath();ctx.fill();
 ctx.fillStyle='#f0cfac';ctx.beginPath();ctx.ellipse(4,24,26,18,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#171717';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-29,-18);ctx.lineTo(-5,-27);ctx.moveTo(6,-27);ctx.lineTo(30,-18);ctx.stroke();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-14,-4,12,0,Math.PI*2);ctx.arc(15,-4,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-10,-3,5,0,Math.PI*2);ctx.arc(19,-3,5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f2ad16';ctx.beginPath();ctx.moveTo(-2,8);ctx.lineTo(43,12);ctx.lineTo(5,28);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawPig(p){if(!p.alive)return;ctx.save();ctx.translate(p.x,p.y);ctx.strokeStyle='#276d36';ctx.lineWidth=3;const g=ctx.createRadialGradient(-9,-12,2,0,0,p.r);g.addColorStop(0,'#d9fa9a');g.addColorStop(1,'#49a94b');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#64b94f';ctx.beginPath();ctx.arc(-17,-23,9,0,Math.PI*2);ctx.arc(17,-23,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-10,-7,8,0,Math.PI*2);ctx.arc(10,-7,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#182018';ctx.beginPath();ctx.arc(-8,-6,3.5,0,Math.PI*2);ctx.arc(12,-6,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#83c65e';ctx.beginPath();ctx.ellipse(0,12,17,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#315d31';ctx.beginPath();ctx.arc(-6,12,3,0,Math.PI*2);ctx.arc(6,12,3,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawBlock(b){if(b.dead)return;ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);let fill,stroke;if(b.mat==='wood'){fill='#c88b4b';stroke='#74451f'}else if(b.mat==='stone'){fill='#aaa69e';stroke='#5d5a55'}else{fill='rgba(117,211,235,.5)';stroke='#347b99'}ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(-b.w/2,-b.h/2,b.w,b.h,6);ctx.fill();ctx.stroke();if(b.mat==='wood'){ctx.strokeStyle='rgba(92,53,28,.45)';ctx.lineWidth=2;for(let y=-b.h/2+10;y<b.h/2;y+=15){ctx.beginPath();ctx.moveTo(-b.w/2+5,y);ctx.quadraticCurveTo(0,y+3,b.w/2-5,y-2);ctx.stroke()}}if(b.mat==='glass'){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-b.w*.25,-b.h*.4);ctx.lineTo(b.w*.22,b.h*.35);ctx.stroke()}ctx.restore()}
function trajectory(){if(!dragging||!bird||bird.fly)return;const vx=(sling.x-bird.x)*7,vy=(sling.y-bird.y)*7;ctx.fillStyle='rgba(255,255,255,.9)';for(let i=1;i<=22;i++){const t=i*.09,px=sling.x+vx*t,py=sling.y+vy*t+.5*G*t*t;if(px<0||px>W||py>=GROUND)break;let hit=false;for(const b of blocks){if(b.dead)continue;if(px>=b.x-4&&px<=b.x+b.w+4&&py>=b.y-4&&py<=b.y+b.h+4){hit=true;break}}if(hit)break;ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill()}}
function addScore(n,x,y){score+=n;texts.push({x,y,s:'+'+n,a:1})}
function particlesAt(x,y,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*500,vy:-Math.random()*300,life:.45+Math.random()*.4})}
function circleRect(b){const cx=clamp(bird.x,b.x,b.x+b.w),cy=clamp(bird.y,b.y,b.y+b.h);return Math.hypot(bird.x-cx,bird.y-cy)<bird.r}
function resolveBird(){for(const p of pigs){if(p.alive&&dist(bird,p)<bird.r+p.r){p.alive=false;addScore(500,p.x,p.y);particlesAt(p.x,p.y,18);bird.vx*=.45;bird.vy*=.45}}
 for(const b of blocks){if(b.dead||!circleRect(b))continue;const power=Math.hypot(bird.vx,bird.vy);b.hp-=power*.022;b.vx+=bird.vx*.025;b.vy+=bird.vy*.025;if(b.hp<=0){b.dead=true;addScore(b.mat==='stone'?200:b.mat==='wood'?100:50,b.x+b.w/2,b.y+b.h/2);particlesAt(b.x+b.w/2,b.y+b.h/2,20)}else particlesAt(bird.x,bird.y,5);bird.vx*=.55;bird.vy*=.55}}
function step(){
 if(mode!=='playing'||!bird)return;
 if(bird.fly&&bird.alive){bird.age+=DT;bird.vy+=G*DT;bird.vx*=Math.pow(.995,1);bird.vy*=Math.pow(.995,1);bird.vx=clamp(bird.vx,-MAXV,MAXV);bird.vy=clamp(bird.vy,-MAXV,MAXV);const ox=bird.x,oy=bird.y;bird.x+=bird.vx*DT;bird.y+=bird.vy*DT;resolveBird();
  if(bird.x-bird.r<0){bird.x=bird.r;bird.vx=Math.abs(bird.vx)*.35}if(bird.x+bird.r>W){bird.x=W-bird.r;bird.vx=-Math.abs(bird.vx)*.35}if(bird.y-bird.r<0){bird.y=bird.r;bird.vy=Math.abs(bird.vy)*.35}
  if(bird.y+bird.r>=GROUND){bird.y=GROUND-bird.r;bird.vy=-Math.abs(bird.vy)*.2;bird.vx*=.85;bird.rest+=DT;if(Math.hypot(bird.vx,bird.vy)<100&&bird.rest>1)bird.alive=false}else bird.rest=0;
  if(bird.age>8)bird.alive=false;
 }
 // 简单稳定的建筑重力/支撑：底层落地，上层由相交支撑，否则下落。
 for(const b of blocks){if(b.dead)continue;let supported=b.y+b.h>=GROUND-1;for(const q of blocks){if(q===b||q.dead)continue;const overlap=b.x+6<q.x+q.w&&b.x+b.w-6>q.x;if(overlap&&Math.abs(b.y+b.h-q.y)<7&&q.y<b.y+20)supported=true}if(!supported){b.vy+=G*DT;b.y+=b.vy*DT}else{b.y=Math.min(b.y,GROUND-b.h);if(b.vy>0)b.vy*=.15;b.vy=0}if(b.y+b.h>GROUND){b.y=GROUND-b.h;b.vy=0}}
 for(const p of pigs){if(!p.alive)continue;let supported=p.y+p.r>=GROUND-1;for(const b of blocks){if(b.dead)continue;if(p.x>b.x- p.r&&p.x<b.x+b.w+p.r&&Math.abs(p.y+p.r-b.y)<6)supported=true}if(!supported){p.vy+=G*DT;p.y+=p.vy*DT}else{p.y=Math.min(p.y,GROUND-p.r);p.vy=0}}
 for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.vy+=800*DT;q.x+=q.vx*DT;q.y+=q.vy*DT;q.life-=DT;if(q.life<=0)particles.splice(i,1)}for(let i=texts.length-1;i>=0;i--){texts[i].y-=40*DT;texts[i].a-=DT;if(texts[i].a<=0)texts.splice(i,1)}
 if(!bird.alive&&!shotSettled){shotSettled=true;resultTimer=1.2}
 if(shotSettled){resultTimer-=DT;if(resultTimer<=0){shotSettled=false;if(pigs.every(p=>!p.alive)){mode='win'}else if(birdsLeft<=0){mode='lose'}else{birdsLeft--;spawnBird()}}}
}
function drawHUD(){ctx.fillStyle='#fff5d8';ctx.strokeStyle='#704526';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(25,20,365,62,16);ctx.fill();ctx.stroke();ctx.fillStyle='#633d25';ctx.font='900 23px Arial,"Microsoft YaHei"';ctx.fillText('第 1 关',45,59);ctx.fillText('剩余小鸟：'+birdsLeft,130,59);ctx.fillText('得分：'+score,280,59)}
function overlay(title,button,sub){ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff5d8';ctx.strokeStyle='#704526';ctx.lineWidth=6;ctx.beginPath();ctx.roundRect(330,185,620,350,30);ctx.fill();ctx.stroke();ctx.fillStyle='#653d22';ctx.font='900 58px Arial,"Microsoft YaHei"';ctx.textAlign='center';ctx.fillText(title,640,290);ctx.font='700 24px Arial,"Microsoft YaHei"';ctx.fillText(sub,640,335);ctx.fillStyle='#e7a928';ctx.beginPath();ctx.roundRect(500,405,280,72,20);ctx.fill();ctx.fillStyle='#4c2d18';ctx.font='900 28px Arial,"Microsoft YaHei"';ctx.fillText(button,640,451);ctx.textAlign='left'}
function drawStart(){ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff5d8';ctx.strokeStyle='#704526';ctx.lineWidth=6;ctx.beginPath();ctx.roundRect(300,145,680,430,34);ctx.fill();ctx.stroke();ctx.fillStyle='#d83432';ctx.font='900 68px Arial,"Microsoft YaHei"';ctx.textAlign='center';ctx.fillText('愤怒的小鸟',640,270);ctx.fillStyle='#633d25';ctx.font='700 24px Arial,"Microsoft YaHei"';ctx.fillText('经典弹弓物理 · 第 1 关',640,315);ctx.fillStyle='#e7a928';ctx.beginPath();ctx.roundRect(480,390,320,82,22);ctx.fill();ctx.fillStyle='#4c2d18';ctx.font='900 30px Arial,"Microsoft YaHei"';ctx.fillText('开始游戏',640,443);ctx.textAlign='left'}
function render(){drawBackground();if(mode==='start'){drawStart();return}drawSling();trajectory();for(const b of blocks)drawBlock(b);for(const p of pigs)drawPig(p);drawBird(bird);drawHUD();for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/0.8);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x,q.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const q of texts){ctx.globalAlpha=q.a;ctx.fillStyle='#fff8a0';ctx.font='900 24px Arial';ctx.strokeStyle='#55351d';ctx.lineWidth=4;ctx.strokeText(q.s,q.x,q.y);ctx.fillText(q.s,q.x,q.y)}ctx.globalAlpha=1;if(mode==='win')overlay('关卡通过！','重新开始','最终得分：'+score);if(mode==='lose')overlay('再试一次','重新开始','最终得分：'+score)}
function pointerDown(e){e.preventDefault();const p=worldPoint(e);if(mode==='start'){if(p.x>480&&p.x<800&&p.y>390&&p.y<472)reset();return}if(mode==='win'||mode==='lose'){if(p.x>500&&p.x<780&&p.y>405&&p.y<477)reset();return}if(mode==='playing'&&bird&&!bird.fly&&bird.alive&&dist(p,bird)<58){dragging=true;try{c.setPointerCapture(e.pointerId)}catch(_){}moveBird(p)}}
function moveBird(p){if(!dragging||!bird||bird.fly)return;let dx=p.x-sling.x,dy=p.y-sling.y;if(dx>15)dx=15;const len=Math.hypot(dx,dy);if(len>MAXDRAG){dx=dx/len*MAXDRAG;dy=dy/len*MAXDRAG}if(dy>70)dy=70;bird.x=sling.x+dx;bird.y=sling.y+dy}
function pointerMove(e){e.preventDefault();if(dragging)moveBird(worldPoint(e))}
function pointerUp(e){e.preventDefault();if(!dragging)return;dragging=false;const dx=sling.x-bird.x,dy=sling.y-bird.y,len=Math.hypot(dx,dy);if(len<12){bird.x=sling.x;bird.y=470;return}const force=Math.min(1600,len*7);bird.vx=dx/len*force;bird.vy=dy/len*force;bird.fly=true;bird.age=0;bird.rest=0}
c.addEventListener('pointerdown',pointerDown);c.addEventListener('pointermove',pointerMove);c.addEventListener('pointerup',pointerUp);c.addEventListener('pointercancel',pointerUp);c.addEventListener('contextmenu',e=>e.preventDefault());
function loop(t){if(!last)last=t;let dt=Math.min(.1,(t-last)/1000);last=t;acc+=dt;while(acc>=DT){step();acc-=DT}render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
