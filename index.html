<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Angry Birds Classic Fan Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79cbea;touch-action:none}#app{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}canvas{display:block;touch-action:none}
</style></head><body><div id="app"><canvas id="game"></canvas></div><script>
const C=document.getElementById('game'),ctx=C.getContext('2d');
const W=1280,H=720,G=615;let scale=1,ox=0,oy=0,dpr=1,mode='ready',drag=false,score=0,shots=3,last=0,shake=0;
let bird,pigs=[],blocks=[],dust=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);const vw=innerWidth,vh=innerHeight;scale=Math.min(vw/W,vh/H);ox=(vw-W*scale)/2;oy=(vh-H*scale)/2;C.width=vw*dpr;C.height=vh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);reset()}
function reset(){mode='ready';drag=false;score=0;shots=3;shake=0;dust=[];bird={x:190,y:535,r:37,vx:0,vy:0,fly:false,alive:true};blocks=[];pigs=[];level()}
function B(x,y,w,h,type){blocks.push({x,y,w,h,type,hp:type==='glass'?2:type==='stone'?5:3,vx:0,vy:0,r:0,vr:0,dead:false})}
function P(x,y,r=25){pigs.push({x,y,r,vy:0,alive:true})}
function level(){
 B(790,570,30,150,'wood');B(1000,570,30,150,'wood');B(820,495,180,28,'wood');
 B(830,410,28,90,'stone');B(982,410,28,90,'stone');B(815,365,210,28,'glass');P(910,535,27);
 B(1080,570,30,150,'wood');B(1230,570,30,150,'wood');B(1110,495,160,28,'wood');
 B(1120,410,28,90,'stone');B(1215,410,28,90,'stone');B(1100,365,180,28,'glass');P(1165,535,27);
 B(925,310,30,100,'wood');B(1090,310,30,100,'wood');B(950,265,145,28,'stone');P(1005,230,25);
 B(120,595,75,20,'grass');
}
function world(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
function ellipse(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2)}
function cloud(x,y,s){ctx.save();ctx.globalAlpha=.72;ctx.fillStyle='#fff';ellipse(x,y,42*s,23*s);ctx.fill();ellipse(x+35*s,y-14*s,38*s,28*s);ctx.fill();ellipse(x+73*s,y,43*s,24*s);ctx.fill();ctx.restore()}
function background(){
 let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#55c8ef');sky.addColorStop(.62,'#bdeaf3');sky.addColorStop(.63,'#b7d98a');sky.addColorStop(1,'#77b84d');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 cloud(115,100,1.1);cloud(430,150,.75);cloud(785,90,1.25);cloud(1130,145,.8);
 ctx.fillStyle='#93ca70';ctx.beginPath();ctx.moveTo(0,530);ctx.quadraticCurveTo(170,430,340,530);ctx.quadraticCurveTo(520,420,720,530);ctx.quadraticCurveTo(920,420,1280,525);ctx.lineTo(1280,720);ctx.lineTo(0,720);ctx.fill();
 ctx.fillStyle='#66a945';ctx.fillRect(0,G,W,H-G);ctx.fillStyle='#89c65a';ctx.beginPath();ctx.moveTo(0,G);for(let i=0;i<W;i+=34)ctx.quadraticCurveTo(i+17,G-14,i+34,G);ctx.lineTo(W,G+28);ctx.lineTo(0,G+28);ctx.fill();
 ctx.fillStyle='#80552f';ctx.fillRect(0,643,W,77);ctx.fillStyle='#604126';for(let i=20;i<W;i+=47){ctx.beginPath();ctx.arc(i,660+(i%41),2.3,0,7);ctx.fill()}
}
function slingshot(){let x=190,y=590;ctx.lineCap='round';ctx.strokeStyle='#51331f';ctx.lineWidth=27;ctx.beginPath();ctx.moveTo(x-23,y+45);ctx.lineTo(x-12,y-58);ctx.moveTo(x+23,y+45);ctx.lineTo(x+12,y-58);ctx.stroke();ctx.strokeStyle='#a76a35';ctx.lineWidth=14;ctx.stroke();if(!bird.fly&&drag){ctx.strokeStyle='#3b2418';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x-12,y-58);ctx.lineTo(bird.x,bird.y);ctx.moveTo(x+12,y-58);ctx.lineTo(bird.x,bird.y);ctx.stroke()}}
function redBird(){if(!bird.alive)return;let x=bird.x,y=bird.y,r=bird.r;ctx.save();ctx.translate(x,y);if(bird.fly)ctx.rotate(Math.atan2(bird.vy,bird.vx)*.07);
 // shadow
 ctx.save();ctx.globalAlpha=.2;ctx.fillStyle='#472019';ellipse(5,30,31,9);ctx.fill();ctx.restore();
 // tail: three black feather silhouettes
 ctx.fillStyle='#27201e';ctx.beginPath();ctx.moveTo(-27,-8);ctx.lineTo(-66,-40);ctx.lineTo(-54,-2);ctx.lineTo(-74,30);ctx.lineTo(-27,17);ctx.closePath();ctx.fill();
 // body, hand-shaped contour
 let g=ctx.createRadialGradient(-13,-17,4,5,8,48);g.addColorStop(0,'#ff7662');g.addColorStop(.45,'#e94338');g.addColorStop(.82,'#cf2e31');g.addColorStop(1,'#9f242a');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-36,4);ctx.bezierCurveTo(-42,-27,-24,-48,4,-47);ctx.bezierCurveTo(35,-45,45,-24,40,8);ctx.bezierCurveTo(39,34,20,48,-5,45);ctx.bezierCurveTo(-27,43,-39,29,-36,4);ctx.closePath();ctx.fill();
 // two head feathers
 ctx.fillStyle='#b9232b';ctx.beginPath();ctx.moveTo(-12,-42);ctx.lineTo(-21,-78);ctx.lineTo(-3,-57);ctx.lineTo(13,-82);ctx.lineTo(16,-43);ctx.closePath();ctx.fill();
 // peach belly
 ctx.fillStyle='#f5d5b8';ctx.beginPath();ctx.moveTo(-20,22);ctx.bezierCurveTo(-9,7,20,8,28,24);ctx.bezierCurveTo(20,44,-7,48,-24,33);ctx.closePath();ctx.fill();
 // face freckles
 ctx.fillStyle='#a82a2d';ellipse(-26,2,3.2,4);ctx.fill();ellipse(-20,10,3.2,4);ctx.fill();ellipse(-13,3,3.2,4);ctx.fill();
 // heavy angry eyebrows
 ctx.strokeStyle='#211b1b';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-28,-20);ctx.lineTo(-4,-29);ctx.moveTo(5,-29);ctx.lineTo(30,-20);ctx.stroke();
 // eyes
 ctx.fillStyle='#fff';ellipse(-15,-7,12,16);ctx.fill();ellipse(16,-7,12,16);ctx.fill();ctx.fillStyle='#171515';ellipse(-11,-5,5,8);ctx.fill();ellipse(20,-5,5,8);ctx.fill();
 // beak upper/lower
 ctx.fillStyle='#f2a51b';ctx.strokeStyle='#7d4812';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-1,6);ctx.lineTo(40,12);ctx.lineTo(4,24);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(4,16);ctx.lineTo(34,17);ctx.stroke();
 ctx.restore()}
function pig(p){if(!p.alive)return;let x=p.x,y=p.y,r=p.r;ctx.save();ctx.translate(x,y);let g=ctx.createRadialGradient(-9,-12,2,0,0,r*1.2);g.addColorStop(0,'#c9f28a');g.addColorStop(.48,'#77cc4f');g.addColorStop(1,'#378e39');ctx.fillStyle=g;ellipse(0,0,r,r*.92);ctx.fill();ctx.fillStyle='#53aa40';ellipse(-15,-21,9,11);ctx.fill();ellipse(15,-21,9,11);ctx.fill();ctx.fillStyle='#173b20';ellipse(-9,-6,3.2,4.5);ctx.fill();ellipse(10,-6,3.2,4.5);ctx.fill();ctx.fillStyle='#9bdc69';ellipse(0,9,12,8);ctx.fill();ctx.fillStyle='#345f30';ellipse(-5,9,2.8,4);ctx.fill();ellipse(5,9,2.8,4);ctx.fill();ctx.restore()}
function block(b){if(b.dead)return;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);let g=ctx.createLinearGradient(0,0,b.w,b.h);if(b.type==='wood'){g.addColorStop(0,'#f6c27e');g.addColorStop(.45,'#d9954c');g.addColorStop(1,'#965027')}else if(b.type==='stone'){g.addColorStop(0,'#e5e6e1');g.addColorStop(.5,'#b4b7b2');g.addColorStop(1,'#686e69')}else{g.addColorStop(0,'#f5ffffcc');g.addColorStop(.5,'#82dfe8aa');g.addColorStop(1,'#2faab499')}ctx.fillStyle=g;ctx.strokeStyle=b.type==='wood'?'#713d1f':b.type==='stone'?'#555b56':'#278b95';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(0,0,b.w,b.h,5);ctx.fill();ctx.stroke();
 if(b.type==='wood'){ctx.strokeStyle='#74421f99';ctx.lineWidth=2;for(let yy=11;yy<b.h;yy+=14){ctx.beginPath();ctx.moveTo(8,yy);ctx.bezierCurveTo(b.w*.3,yy-5,b.w*.65,yy+6,b.w-7,yy-1);ctx.stroke()}ctx.fillStyle='#6c381c';for(let i=0;i<3;i++){ellipse(13+i*17,12+(i%2)*13,2,1.3);ctx.fill()}}
 if(b.type==='stone'){ctx.strokeStyle='#70757088';ctx.lineWidth=2;for(let yy=17;yy<b.h;yy+=20){ctx.beginPath();ctx.moveTo(5,yy);ctx.lineTo(b.w-5,yy+3);ctx.stroke()}}
 if(b.type==='glass'){ctx.strokeStyle='#ffffffbb';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(8,b.h-5);ctx.lineTo(b.w-8,7);ctx.stroke();ctx.strokeStyle='#bafaff77';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.w*.25,b.h);ctx.lineTo(b.w*.7,0);ctx.stroke()}
 ctx.restore()}
function aim(){if(!drag)return;let dx=bird.x-190,dy=bird.y-532,vx=-dx*5.5,vy=-dy*5.5,px=bird.x,py=bird.y;for(let i=0;i<28;i++){px+=vx*.045;py+=vy*.045;vy+=.7;ctx.globalAlpha=1-i/30;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,3,0,7);ctx.fill()}ctx.globalAlpha=1}
function explode(x,y,col){for(let i=0;i<18;i++)dust.push({x,y,vx:(Math.random()-.5)*280,vy:(Math.random()-.8)*260,t:1,s:2+Math.random()*5,c:col})}
function collide(){for(const b of blocks){if(b.dead)continue;let cx=clamp(bird.x,b.x,b.x+b.w),cy=clamp(bird.y,b.y,b.y+b.h);if(Math.hypot(bird.x-cx,bird.y-cy)<bird.r){let power=Math.hypot(bird.vx,bird.vy);b.hp-=Math.max(1,power/70);b.vx+=bird.vx*.045;b.vy+=bird.vy*.045;b.vr+=bird.vx*.0005;score+=50;shake=6;explode(bird.x,bird.y,b.type==='glass'?'#b9fbff':b.type==='stone'?'#c6c9c4':'#d48a46');if(b.hp<=0){b.dead=true;score+=100;explode(b.x+b.w/2,b.y+b.h/2,b.type==='glass'?'#d9ffff':b.type==='stone'?'#c6c9c4':'#d48a46')}break}}
 for(const p of pigs)if(p.alive&&Math.hypot(bird.x-p.x,bird.y-p.y)<bird.r+p.r){p.alive=false;score+=500;explode(p.x,p.y,'#7bd35a');shake=14}}
function physics(dt){if(mode==='fly'){bird.vy+=700*dt;bird.x+=bird.vx*dt;bird.y+=bird.vy*dt;bird.vx*=.999;bird.vy*=.999;collide();if(bird.y>G){bird.y=G;bird.vy*=-.3;bird.vx*=.65;if(Math.abs(bird.vy)<40){bird.alive=false;nextShot()}}if(bird.x>1330||bird.y>760){bird.alive=false;nextShot()}}
 for(const b of blocks){if(b.dead)continue;b.vy+=500*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.985;b.vy*=.985;b.r+=b.vr*dt;b.vr*=.985;if(b.y+b.h>G){b.y=G-b.h;b.vy*=-.12;b.vx*=.88}}
 for(const p of pigs)if(p.alive){p.vy+=500*dt;p.y+=p.vy*dt;if(p.y+p.r>G){p.y=G-p.r;p.vy=0}}
 for(const q of dust){q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=400*dt}dust=dust.filter(q=>q.t>0);shake=Math.max(0,shake-dt*18);if(pigs.every(p=>!p.alive)&&mode!=='win'){mode='win'}}
function nextShot(){if(mode!=='fly')return;shots--;if(pigs.every(p=>!p.alive)){mode='win';return}if(shots<=0){mode='lose';return}setTimeout(()=>{bird={x:190,y:535,r:37,vx:0,vy:0,fly:false,alive:true};mode='ready'},300)}
function hud(){ctx.fillStyle='#fff9e8e8';ctx.strokeStyle='#654027';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(18,16,205,50,15);ctx.fill();ctx.stroke();ctx.fillStyle='#3f2a1c';ctx.font='900 23px Arial';ctx.fillText('SCORE  '+score,34,49);ctx.beginPath();ctx.roundRect(W-148,16,130,50,15);ctx.fill();ctx.stroke();ctx.fillStyle='#3f2a1c';ctx.font='900 18px Arial';ctx.fillText('↻  重来',W-123,49);if(mode==='win'||mode==='lose'){ctx.fillStyle='#0008';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff4d6';ctx.strokeStyle='#633d25';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(400,220,480,235,28);ctx.fill();ctx.stroke();ctx.fillStyle='#422b1c';ctx.textAlign='center';ctx.font='900 48px Arial';ctx.fillText(mode==='win'?'LEVEL CLEAR!':'TRY AGAIN',640,310);ctx.font='900 27px Arial';ctx.fillText('Score  '+score,640,360);ctx.font='bold 18px Arial';ctx.fillText('点击右上角 ↻ 重新开始',640,407);ctx.textAlign='left'}}
function draw(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background();for(const b of blocks)block(b);for(const p of pigs)pig(p);slingshot();aim();redBird();for(const q of dust){ctx.globalAlpha=Math.max(0,q.t);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();hud()}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;physics(dt);draw();requestAnimationFrame(loop)}
C.addEventListener('pointerdown',e=>{if(mode!=='ready')return;const p=world(e);if(Math.hypot(p.x-bird.x,p.y-bird.y)<70){drag=true;C.setPointerCapture(e.pointerId)}});
C.addEventListener('pointermove',e=>{if(!drag)return;const p=world(e);bird.x=clamp(p.x,90,270);bird.y=clamp(p.y,390,590);});
C.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const dx=bird.x-190,dy=bird.y-532;bird.vx=-dx*5.7;bird.vy=-dy*5.7;bird.x=190;bird.y=532;bird.fly=true;mode='fly'});
C.addEventListener('pointercancel',()=>drag=false);C.addEventListener('click',e=>{const p=world(e);if(p.x>1130&&p.y<90)reset()});addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,120));resize();requestAnimationFrame(loop);
</script></body></html>
